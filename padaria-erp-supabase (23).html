      else if(path === 'login'){ setRole('admin'); }
      else if(path === 'pedido'){ setRole('cliente'); setClienteSlug(null); }
      else if(path.startsWith('pedido/')){ setRole('cliente'); setClienteSlug(path.slice('pedido/'.length)); }
      else if(tabKeys.includes(path)){ setRole('admin'); setTab(path); }
      else { setRole('admin'); }
      setHashReady(true);
    };
    applyHash();
    window.addEventListener('hashchange', applyHash);
    return () => window.removeEventListener('hashchange', applyHash);
  }, []);

  useEffect(() => {
    if(!hashReady || session===undefined) return;
    let route = '';
    if(role === 'cliente') route = clienteSlug ? 'pedido/'+clienteSlug : 'pedido';
    else if(role === 'admin') route = session ? tab : 'login';
    const newHash = '#/'+route;
    if(window.location.hash !== newHash) window.location.hash = newHash;
  }, [role, tab, session, hashReady, clienteSlug]);

  useEffect(() => {
    if(!configReady) return;
    const sb = getSupabaseClient();
    if(!sb) return;
    sb.auth.getSession().then(({data}) => setSession(data.session));
    const {data: sub} = sb.auth.onAuthStateChange((event, sess) => {
      if(event==='PASSWORD_RECOVERY') setIsRecovery(true);
      setSession(sess);
    });
    return () => sub.subscription.unsubscribe();
  }, [configReady]);

  const userId = (session && session.user) ? session.user.id : null;
  const [db, setDB, saving, loadError, saveError, reloadNow, storeSlug, updateStoreSlug] = useDB(userId);

  if(!configReady){
    return <SupabaseSetupScreen onSaved={()=>setConfigReady(true)}/>;
  }

  // ---- Modo cliente: tela cheia, sem menu, sem precisar de sessão ----
  if(role==='cliente'){
    return <ClienteView slug={clienteSlug || storeSlug} onExit={()=>{setRole(null); setClienteSlug(null);}}/>;
  }

  // ---- role === 'admin' a partir daqui ----
  if(session===undefined){
    return <div style={{padding:40, fontFamily:"'Helvetica Neue',sans-serif", color:'var(--ink-soft)'}}>Carregando...</div>;
  }
  if(isRecovery){
    return <RecoveryScreen onDone={()=>setIsRecovery(false)}/>;
  }
  if(!session){
    return <AuthScreen/>;
  }
  if(db === null){
    return <div style={{padding:40, fontFamily:"'Helvetica Neue',sans-serif", color:'var(--ink-soft)'}}>Carregando dados da padaria... {loadError && <div style={{color:'var(--red)'}}>{loadError}</div>}</div>;
  }

  const logout = async () => {
    const sb = getSupabaseClient();
    await sb.auth.signOut();
    setRole(null);
  };

  return (
    <div className="app">
      <AppBackground/>
      <div className={"sidebar-overlay"+(menuOpen?' open':'')} onClick={()=>setMenuOpen(false)}/>
      <div className={"sidebar"+(menuOpen?' open':'')}>
        <div className="brand">
          <div className="brand-mark">J</div>
          <div className="brand-name">Joaquim's</div>
          <div className="brand-sub">Gestão da Padaria</div>
        </div>
        <nav>
          {tabs.map(([key,label]) => (
            <button type="button" key={key} className={tab===key?'active':''} onClick={()=>{setTab(key); setMenuOpen(false);}}>{label}</button>
          ))}
        </nav>
        <div style={{marginTop:'auto', padding:'14px 20px', display:'flex', flexDirection:'column', gap:6}}>
          <button type="button" className="btn small outline" onClick={reloadNow}>🔄 Atualizar pedidos</button>
          <button type="button" className="btn small outline" onClick={()=>{setClienteSlug(storeSlug); setRole('cliente');}}>🔀 Ver tela do cliente</button>
          <button type="button" className="btn small outline" onClick={logout}>Sair</button>
        </div>
      </div>
      <div className="main">
        <button type="button" className="menu-toggle" onClick={()=>setMenuOpen(true)}>☰ Menu</button>
        {tab==='dashboard' && <Dashboard db={db}/>}
        {tab==='pdv' && <PDV db={db} setDB={setDB}/>}
        {tab==='produtos' && <Produtos db={db} setDB={setDB}/>}
        {tab==='estoque' && <Estoque db={db}/>}
        {tab==='compras' && <Compras db={db} setDB={setDB}/>}
        {tab==='transferencias' && <Transferencias db={db} setDB={setDB}/>}
        {tab==='receitas' && <Receitas db={db} setDB={setDB}/>}
        {tab==='producao' && <Producao db={db} setDB={setDB}/>}
        {tab==='pedidos' && <Pedidos db={db} setDB={setDB}/>}
        {tab==='clientes' && <Clientes db={db} setDB={setDB}/>}
        {tab==='precificacao' && <Precificacao db={db} setDB={setDB}/>}
        {tab==='ajustes' && <Ajustes db={db} setDB={setDB}/>}
        {tab==='relatorios' && <Relatorios db={db}/>}
        {tab==='empresa' && <Empresa db={db} setDB={setDB} storeSlug={storeSlug} updateStoreSlug={updateStoreSlug}/>}
        {tab==='backup' && <>
          <Conta session={session}/>
          <Backup db={db} setDB={setDB}/>
        </>}
      </div>
      <div className={"save-indicator"+(saving?' show':'')}>Salvando...</div>
      {saveError && <div style={{position:'fixed', bottom:16, left:16, right:16, maxWidth:520, margin:'0 auto', background:'#fff0f0', border:'1px solid var(--red)', color:'var(--red)', padding:'10px 14px', borderRadius:8, fontSize:13, zIndex:999}}>⚠ {saveError}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
