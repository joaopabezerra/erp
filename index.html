          <Field label="Bairro"><input value={form.neighborhood} onChange={e=>setForm({...form,neighborhood:e.target.value})}/></Field>

        </div>

          <Field label="Cidade"><input value={form.city} onChange={e=>setForm({...form,city:e.target.value})}/></Field>
          <Field label="UF"><input value={form.state} onChange={e=>setForm({...form,state:e.target.value})} maxLength={2}/></Field>
        </div>
        <div className="modal-actions">
          <button type="button" className="btn outline" onClick={()=>setModal(null)}>Cancelar</button>
          <button type="button" className="btn" onClick={save}>Salvar</button>
        </div>
        </>)}
      </Modal>}
    </div>
  );
}

function Backup({db, setDB}){
  const [exportUrl, setExportUrl] = useState(null);
  const [importData, setImportData] = useState(null);
  const [importError, setImportError] = useState('');
  const [flash, setFlash] = useState('');

  const generateExport = () => {
    const json = JSON.stringify(db, null, 2);
    setExportUrl(makeBlobUrl(json, 'application/json;charset=utf-8'));
  };

  const onFileChange = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    setImportError(''); setImportData(null);
    const reader = new FileReader();
    reader.onload = (ev) => {
      try{
        const parsed = JSON.parse(ev.target.result);
        if(typeof parsed !== 'object' || !parsed.products){ setImportError('Este arquivo não parece ser um backup válido deste sistema.'); return; }
        setImportData(parsed);
      }catch(err){ setImportError('Não foi possível ler este arquivo — precisa ser um .json de backup gerado por este sistema.'); }
    };
    reader.readAsText(file);
  };

  const confirmImport = () => {
    setDB(() => ({...emptyDB(), ...importData}));
    setImportData(null);
    setFlash('Backup restaurado com sucesso.');
    setTimeout(()=>setFlash(''), 3000);
  };

  return (
    <div>
      <h1 className="page-title">Backup de Dados</h1>
      <div className="page-sub">Exporte tudo (produtos, estoque, receitas, compras, produção, pedidos, clientes, precificação etc.) ou restaure a partir de um backup salvo antes.</div>

      <div className="card">
        <h2>Exportar backup completo</h2>
        <div className="muted" style={{marginBottom:10}}>Baixa um arquivo .json com todas as informações do sistema. Guarde em lugar seguro — serve pra restaurar depois, ou levar os dados pra outro dispositivo/conta.</div>
        <div style={{display:'flex', gap:8, alignItems:'center'}}>
          <button type="button" className="btn" onClick={generateExport}>Gerar backup</button>
          {exportUrl && <a className="btn gold" href={exportUrl} download={`backup-padaria-${today()}.json`}>Baixar backup (.json)</a>}
        </div>
      </div>

      <div className="card">
        <h2>Importar / restaurar backup</h2>
        <div className="muted" style={{color:'var(--red)', marginBottom:10}}>Atenção: isso substitui TODOS os dados atuais pelos do arquivo importado — produtos, estoque, pedidos, tudo. Não tem como desfazer depois de confirmar.</div>
        <input type="file" accept=".json,application/json" onChange={onFileChange}/>
        {importError && <div className="muted" style={{color:'var(--red)', marginTop:8}}>{importError}</div>}
        {importData && (
          <div style={{marginTop:12}}>
            <div className="muted" style={{marginBottom:8}}>
              Arquivo carregado: {(importData.products||[]).length} produtos, {(importData.orders||[]).length} pedidos, {(importData.purchases||[]).length} compras, {(importData.recipes||[]).length} fichas técnicas.
            </div>
            <ConfirmButton onConfirm={confirmImport} label="Restaurar este backup" confirmLabel="Confirma? Isso apaga os dados atuais"/>
          </div>
        )}
        {flash && <div className="muted" style={{color:'var(--green-deep)', marginTop:10}}>{flash}</div>}
      </div>
    </div>
  );
}


function addrLine(o){
  const parts = [];
  if(o.street) parts.push(o.street + (o.number?', '+o.number:''));
  if(o.neighborhood) parts.push(o.neighborhood);
  const cityUf = [o.city, o.state].filter(Boolean).join('/');
  if(cityUf) parts.push(cityUf);
  if(o.zip) parts.push('CEP '+o.zip);
  return parts.join(' — ');
}

function generateOrderPdf(order, company){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const co = company || {};
  const cl = order.clientSnapshot || {};

  doc.setFillColor(30,55,33);
  doc.rect(0,0,210,30,'F');
  doc.setTextColor(255,255,255);
  doc.setFontSize(16);
  doc.text(co.name || "Minha Padaria", 14, 12);
  doc.setFontSize(8.5);
  const coLine2 = [co.document, co.phone].filter(Boolean).join(' · ');
  const coAddr = addrLine(co);
  if(coLine2) doc.text(coLine2, 14, 18);
  if(coAddr) doc.text(coAddr, 14, 23);
  doc.setFontSize(10);
  doc.text('Pedido / Recibo de Venda', 150, 12);

  doc.setTextColor(30,30,30);
  doc.setFontSize(10);
  doc.setFont(undefined,'bold');
  doc.text('Cliente', 14, 38);
  doc.setFont(undefined,'normal');
  doc.text(`${cl.name||'—'}${cl.document?' — '+cl.document:''}`, 14, 44);
  const clAddr = addrLine(cl);
  if(clAddr) doc.text(clAddr, 14, 49);
  if(cl.phone) doc.text('Tel: '+cl.phone, 14, 54);

  doc.text(`Data: ${order.date}`, 150, 38);
  doc.text(`Pedido nº: ${order.id.slice(0,8).toUpperCase()}`, 150, 44);

  const rows = order.items.map(it => [
    it.name, `${it.qty} ${it.unit}`, it.unitPrice.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),
    it.total.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})
  ]);

  doc.autoTable({
    startY: 62,
    head: [['Produto','Quantidade','Preço unit.','Total']],
    body: rows,
    headStyles: { fillColor: [47,82,51] },
    styles: { fontSize: 10 },
  });

  const finalY = doc.lastAutoTable.finalY + 10;
  doc.setFontSize(13);
  doc.setFont(undefined,'bold');
  doc.text(`Total do pedido: ${order.total.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}`, 14, finalY);

  doc.setFont(undefined,'normal');
  doc.setFontSize(8);
  doc.setTextColor(120,120,120);
  doc.text('Documento interno de controle — não substitui a Nota Fiscal Eletrônica (NF-e/NFC-e) oficial.', 14, finalY+12);

  const filename = `pedido-${(cl.name||'cliente').replace(/[^a-z0-9]/gi,'-')}-${order.date}.pdf`;
  return { dataUri: doc.output('datauristring'), filename };
}

const ORDER_STAGES = ['Recebido','Confirmado','Em preparo','Pronto','Entregue'];
const digitsOnly = (s) => (s||'').replace(/\D/g,'');

function computeStockDeduction(db, items){
  const sv = {...db.stockVenda}, sp = {...db.stockPrincipal};
  for(const it of items){
    const available = (sv[it.productId]||0)+(sp[it.productId]||0);
    if(it.qty<=0 || available<it.qty) return {error:`Estoque insuficiente de "${it.name}" (disponível: ${available} ${it.unit}).`};
  }
  const itemsWithSplit = items.map(it=>{
    const fromVenda = Math.min(it.qty, sv[it.productId]||0);
    const fromPrincipal = it.qty - fromVenda;
    sv[it.productId] -= fromVenda;
    sp[it.productId] -= fromPrincipal;
    return {...it, fromVenda, fromPrincipal};
  });
  return {sv, sp, itemsWithSplit};
}

function buildOrderWhatsAppLink(order, company){
  const phone = digitsOnly(company && company.phone);
  const code = order.id.slice(0,8).toUpperCase();
  const itemsText = order.items.map(i=>`${i.qty} ${i.unit} de ${i.name}`).join(', ');
  const clientName = (order.clientSnapshot||{}).name || 'Cliente';
  const msg = `📦 Novo pedido!\nCliente: ${clientName}\nPedido nº: ${code}\nTotal: ${money(order.total)}\nItens: ${itemsText}`;
  return `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
}

function OrderStatusBadge({status}){
  const idx = ORDER_STAGES.indexOf(status);
  const cls = idx<=0 ? 'warn' : idx>=4 ? 'ok' : idx>=2 ? 'ok' : 'warn';
  return <span className={"badge "+cls}>{status}</span>;
}

function OrderProgress({status}){

        <div key={s} style={{flex:1, textAlign:'center'}}>

    </div>
  );
}

function ClienteView({onExit}){
  const [mode, setMode] = useState('novo'); // 'novo' | 'confirmado' | 'acompanhar'
  const [products, setProducts] = useState([]);
  const [companyInfo, setCompanyInfo] = useState({name:'', phone:''});
  const [loadError, setLoadError] = useState('');
  const [clientName, setClientName] = useState('');
  const [clientPhone, setClientPhone] = useState('');
  const [clientCode, setClientCode] = useState('');
  const [matchedClientName, setMatchedClientName] = useState(null);
  const [codeError, setCodeError] = useState('');
  const [clientLookupLoading, setClientLookupLoading] = useState(false);
  const [items, setItems] = useState([{tempId: uid(), productId:'', qty:''}]);
  const [error, setError] = useState('');
  const [placedCode, setPlacedCode] = useState(null);
  const [placedStatus, setPlacedStatus] = useState(null);
  const [newClientCode, setNewClientCode] = useState(null);
  const [trackCode, setTrackCode] = useState('');
  const [trackedStatus, setTrackedStatus] = useState(null);
  const [trackError, setTrackError] = useState('');

  useEffect(() => {
    (async () => {
      const sb = getSupabaseClient();
      if(!sb){ setLoadError('Supabase não configurado neste dispositivo.'); return; }
      try{
        const [{data: prods, error: e1}, {data: co}] = await Promise.all([
          sb.from('public_products').select('*'),
          sb.from('public_company').select('*').maybeSingle()
        ]);
        if(e1) throw e1;
        setProducts(prods||[]);
        if(co) setCompanyInfo({name: co.name||'', phone: co.phone||''});
      }catch(e){ setLoadError('Não foi possível carregar os produtos: '+e.message); }
    })();
  }, []);

  const fetchStatus = async (code) => {
    const sb = getSupabaseClient();
    if(!sb) return null;
    const {data} = await sb.from('public_order_status').select('*').eq('code', code).maybeSingle();
    return data;
  };

  // atualização automática do status enquanto a pessoa estiver olhando (consulta a cada 6s)
  useEffect(() => {
    if(!placedCode) return;
    const tick = async () => setPlacedStatus(await fetchStatus(placedCode));
    tick();
    const id = setInterval(tick, 6000);
    return () => clearInterval(id);
  }, [placedCode]);

  useEffect(() => {
    if(!trackCode || mode!=='acompanhar' || !trackedStatus) return;
    const code = trackedStatus.code;
    const id = setInterval(async () => setTrackedStatus(await fetchStatus(code)), 6000);
    return () => clearInterval(id);
  }, [trackedStatus && trackedStatus.code, mode]);

  const setItem = (i, field, val) => { const arr=[...items]; arr[i]={...arr[i],[field]:val}; setItems(arr); };
  const addItem = () => setItems([...items, {tempId: uid(), productId:'', qty:''}]);
  const removeItem = (i) => setItems(items.filter((_,idx)=>idx!==i));

  const resolved = items.filter(it=>it.productId).map(it=>{
    const p = products.find(x=>x.id===it.productId);
    const qty = parseFloat(it.qty)||0;
    return {productId: it.productId, name: p?p.name:'', unit: p?p.unit:'', unitPrice: p?p.sale_price:0, qty, total: qty*(p?p.sale_price:0)};
  });
  const total = resolved.reduce((a,i)=>a+i.total,0);

  const lookupClient = async () => {
    setCodeError('');
    const code = clientCode.trim();
    if(!code){ setCodeError('Digite o código do cliente.'); return; }
    setClientLookupLoading(true);
    try{
      const sb = getSupabaseClient();
      const {data, error: rpcError} = await sb.rpc('lookup_client_by_code', {p_code: code});
      if(rpcError) throw rpcError;
      if(data){
        setClientName(data.name||'');
        setClientPhone(data.phone||'');
        setMatchedClientName(data.name||'');
      } else {
        setCodeError('Código não encontrado — se for seu primeiro pedido, é só preencher nome e telefone abaixo.');
        setMatchedClientName(null);
      }
    }catch(e){
      setCodeError('Não foi possível buscar o código agora: '+e.message);
      setMatchedClientName(null);
    }
    setClientLookupLoading(false);
  };
  const clearMatch = () => { setMatchedClientName(null); setClientCode(''); setClientName(''); setClientPhone(''); setCodeError(''); };

  const submitOrder = async () => {
    if(!clientName.trim() || resolved.length===0 || resolved.some(r=>r.qty<=0)){
      setError('Preencha seu nome e pelo menos um item com quantidade.');
      return;
    }
    setError('');
    const sb = getSupabaseClient();
    try{
      const {data, error: rpcError} = await sb.rpc('submit_client_order', {
        client_name: clientName.trim(), client_phone: clientPhone,
        items: resolved.map(r=>({productId: r.productId, qty: r.qty})),
        client_code: matchedClientName ? clientCode.trim() : null
      });
      if(rpcError) throw rpcError;
      setPlacedCode(data.order_code);
      if(data.is_new_client) setNewClientCode(data.client_code);
      setMode('confirmado');
    }catch(e){ setError('Não foi possível enviar o pedido: '+e.message); }
  };

  const lookupOrder = async () => {
    setTrackError('');
    const code = trackCode.trim().toUpperCase();
    if(!code) return;
    const found = await fetchStatus(code);
    if(!found){ setTrackError('Pedido não encontrado. Confira o código.'); setTrackedStatus(null); return; }
    setTrackedStatus(found);
  };

  const buildWaLink = (code, statusTotal, statusItems) => {
    const phone = digitsOnly(companyInfo.phone);
    const itemsText = (statusItems||[]).map(i=>`${i.qty} ${i.unit} de ${i.name}`).join(', ');
    const msg = `📦 Novo pedido!\nCliente: ${clientName}\nPedido nº: ${code}\nTotal: ${money(statusTotal)}\nItens: ${itemsText}`;
    return `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
  };

  return (
    <div style={{maxWidth:640, margin:'0 auto', padding:'34px 20px'}}>
      <div style={{textAlign:'center', marginBottom:20}}>
        <div className="brand-mark" style={{margin:'0 auto 10px'}}>{(companyInfo.name||'J')[0].toUpperCase()}</div>
        <h1 className="page-title" style={{textAlign:'center'}}>{companyInfo.name || 'Faça seu pedido'}</h1>
        <div className="page-sub" style={{textAlign:'center'}}>Monte seu pedido ou acompanhe um pedido já feito</div>
      </div>

      {loadError && <div className="card"><div className="muted" style={{color:'var(--red)'}}>{loadError}</div></div>}

      {!loadError && mode!=='confirmado' && <div style={{display:'flex', gap:8, justifyContent:'center', marginBottom:16}}>
        <button type="button" className={"btn small "+(mode==='novo'?'gold':'outline')} onClick={()=>setMode('novo')}>Fazer pedido</button>
        <button type="button" className={"btn small "+(mode==='acompanhar'?'gold':'outline')} onClick={()=>setMode('acompanhar')}>Acompanhar pedido</button>
      </div>}

      {!loadError && mode==='novo' && (
        <div className="card">
          {!matchedClientName ? (
            <>
              <div className="row2">
                <Field label="Já é cliente? Código do cliente (opcional)"><input value={clientCode} onChange={e=>setClientCode(e.target.value)} placeholder="Ex: A1B2C3D4"/></Field>
                <div style={{display:'flex', alignItems:'flex-end', paddingBottom:9}}>
                  <button type="button" className="btn small outline" onClick={lookupClient} disabled={clientLookupLoading}>{clientLookupLoading?'Buscando...':'Buscar'}</button>
                </div>
              </div>
              {codeError && <div className="muted" style={{color:'var(--red)', marginBottom:8}}>{codeError}</div>}
              <div className="row2">
                <Field label="Seu nome"><input value={clientName} onChange={e=>setClientName(e.target.value)}/></Field>
                <Field label="Telefone (opcional)"><input value={clientPhone} onChange={e=>setClientPhone(e.target.value)}/></Field>
              </div>
            </>
          ) : (
            <div className="muted" style={{marginBottom:14, display:'flex', justifyContent:'space-between', alignItems:'center'}}>
              <span>Cliente encontrado: <b style={{color:'var(--green-deep)'}}>{matchedClientName}</b></span>
              <button type="button" className="btn small outline" onClick={clearMatch}>Não é você? Buscar de novo</button>
            </div>
          )}
          <label className="field" style={{fontFamily:"'Helvetica Neue',sans-serif", fontSize:11, color:'var(--ink-soft)', textTransform:'uppercase'}}>Produtos</label>
          {products.length===0 && <div className="empty">Nenhum produto disponível pra pedido no momento.</div>}
          {items.map((it,i)=>(
            <div key={it.tempId} className="ing-row">
              <select value={it.productId} onChange={e=>setItem(i,'productId',e.target.value)}>
                <option value="">Selecione...</option>
                {products.map(pr=><option key={pr.id} value={pr.id}>{pr.name} — {money(pr.sale_price)}/{pr.unit}</option>)}
              </select>
              <input type="number" placeholder="qtd" value={it.qty} onChange={e=>setItem(i,'qty',e.target.value)}/>
              <button type="button" className="btn small danger" onClick={()=>removeItem(i)}>×</button>
            </div>
          ))}
          <button type="button" className="btn small outline" onClick={addItem}>+ item</button>
          <div className="muted" style={{margin:'12px 0'}}>Total: <b style={{color:'var(--green-deep)'}}>{money(total)}</b></div>
          {error && <div className="muted" style={{color:'var(--red)', marginBottom:8}}>{error}</div>}
          <button type="button" className="btn" onClick={submitOrder}>Confirmar pedido</button>
        </div>
      )}

      {mode==='confirmado' && placedCode && (
        <div className="card">
          <h2>Pedido enviado!</h2>
          <div className="muted">Guarde este código pra acompanhar depois:</div>
          <div style={{fontSize:22, fontWeight:700, color:'var(--green-deep)', margin:'6px 0 14px 0'}}>{placedCode}</div>
          {newClientCode && <div className="muted" style={{marginBottom:10}}>Seu código de cliente (guarde pra não precisar digitar nome e telefone da próxima vez): <b style={{color:'var(--green-deep)'}}>{newClientCode}</b></div>}
          {placedStatus ? <>
            <OrderProgress status={placedStatus.status}/>
            <div className="muted">Total: {money(placedStatus.total)}</div>
            <a className="btn gold" style={{marginTop:12, display:'inline-block'}} href={buildWaLink(placedCode, placedStatus.total, placedStatus.items)} target="_blank" rel="noopener noreferrer">📲 Avisar a padaria no WhatsApp</a>
          </> : <div className="muted">Carregando status...</div>}
        </div>
      )}

      {!loadError && mode==='acompanhar' && (
        <div className="card">
          <Field label="Código do pedido"><input value={trackCode} onChange={e=>setTrackCode(e.target.value)} placeholder="Ex: A1B2C3D4"/></Field>
          <button type="button" className="btn small" onClick={lookupOrder}>Buscar</button>
          {trackError && <div className="muted" style={{color:'var(--red)', marginTop:8}}>{trackError}</div>}
          {trackedStatus && <>
            <div className="muted" style={{marginTop:14}}>Cliente: {trackedStatus.client_name}</div>
            <OrderProgress status={trackedStatus.status}/>
            <div className="muted">Total: {money(trackedStatus.total)}</div>
          </>}
        </div>
      )}

      <div style={{textAlign:'center', marginTop:24}}>
        <button type="button" className="btn small outline" onClick={onExit}>Sou administrador</button>
      </div>
    </div>
  );
}

function Pedidos({db, setDB}){

  const [form, setForm] = useState(blank);
  const [error, setError] = useState('');
  const [rowErrors, setRowErrors] = useState({});

  const isNewClient = form.clientId === '__new__';

  const setItem = (i, field, val) => {
    const items = [...form.items];
    items[i] = {...items[i], [field]: val};
    if(field==='productId'){
      const p = db.products.find(x=>x.id===val);
      items[i].unitPrice = p ? p.salePrice : '';
    }
    setForm({...form, items});
  };
  const addItem = () => setForm({...form, items:[...form.items, blankItem()]});
  const removeItem = (i) => setForm({...form, items: form.items.filter((_,idx)=>idx!==i)});

  const itemsResolved = form.items.filter(it=>it.productId).map(it => {
    const p = db.products.find(x=>x.id===it.productId);
    const qty = parseFloat(it.qty)||0;
    const unitPrice = parseFloat(it.unitPrice)||0;
    return {productId: it.productId, name: p?p.name:'', unit: p?p.unit:'', qty, unitPrice, total: qty*unitPrice};
  });
  const orderTotal = itemsResolved.reduce((a,i)=>a+i.total,0);

      const p = db.products.find(x=>x.id===val);
      items[i].unitPrice = p ? String(p.salePrice) : '';

    const order = editModal;
    if(order.stockDeducted){
      const sv = {...db.stockVenda}, sp = {...db.stockPrincipal};
      order.items.forEach(it => {
        sv[it.productId] = (sv[it.productId]||0)+(it.fromVenda!=null?it.fromVenda:it.qty);
        sp[it.productId] = (sp[it.productId]||0)+(it.fromPrincipal||0);
      });
      const result = computeStockDeduction({...db, stockVenda: sv, stockPrincipal: sp}, editItemsResolved);
      if(result.error){ setEditError(result.error); return; }
      setDB(d => ({...d, stockVenda: result.sv, stockPrincipal: result.sp,
        orders: d.orders.map(o=>o.id===order.id?{...o, items: result.itemsWithSplit, total: editTotal}:o)}));
    } else {
      setDB(d => ({...d, orders: d.orders.map(o=>o.id===order.id?{...o, items: editItemsResolved, total: editTotal}:o)}));
    }
    setEditModal(null);
  };

  const totalAvailable = (productId) => (db.stockVenda[productId]||0) + (db.stockPrincipal[productId]||0);

  // Pedido criado aqui pelo administrador já nasce Confirmado, com baixa imediata (fluxo de antes)
  const save = () => {
    if((!form.clientId || (isNewClient && !form.newClientName)) || itemsResolved.length===0) return;
    setError('');
    const result = computeStockDeduction(db, itemsResolved);
    if(result.error){ setError(result.error); return; }

    let clientId = form.clientId;
    let clientSnapshot;
    let newClient = null;
    if(isNewClient){
      clientId = uid();
      newClient = {id: clientId, type:'Pessoa Jurídica', name: form.newClientName, document:'', phone:'', email:'',
        street:'', number:'', neighborhood:'', city:'', state:'', zip:''};
      clientSnapshot = newClient;
    } else {
      clientSnapshot = db.clients.find(c=>c.id===clientId) || {name:'Cliente'};
    }

    const order = {id: uid(), clientId, clientSnapshot, date: form.date, items: result.itemsWithSplit, total: orderTotal,
      status:'Confirmado', stockDeducted:true};

    setDB(d => ({...d,
      clients: newClient ? [...d.clients, newClient] : d.clients,
      stockVenda: result.sv, stockPrincipal: result.sp,
      orders: [...d.orders, order]
    }));

    setPdfPreview(generateOrderPdf(order, db.company));
    setForm(blank); setModal(false);
  };

  const setStage = (order, newStatus) => {
    const newIdx = ORDER_STAGES.indexOf(newStatus);
    setRowErrors(prev => ({...prev, [order.id]: ''}));
    if(!order.stockDeducted && newIdx>=1){
      // primeira confirmação — dá baixa no estoque agora
      const result = computeStockDeduction(db, order.items);
      if(result.error){ setRowErrors(prev => ({...prev, [order.id]: result.error})); return; }
      setDB(d => ({...d, stockVenda: result.sv, stockPrincipal: result.sp,
        orders: d.orders.map(o=>o.id===order.id?{...o, items: result.itemsWithSplit, status:newStatus, stockDeducted:true}:o)}));
      return;
    }
    setDB(d => ({...d, orders: d.orders.map(o=>o.id===order.id?{...o, status:newStatus}:o)}));
  };

  const removeOrder = (order) => {
    setDB(d => {
      if(!order.stockDeducted) return {...d, orders: d.orders.filter(o=>o.id!==order.id)};
      const sv = {...d.stockVenda}, sp = {...d.stockPrincipal};
      order.items.forEach(it => {
        sv[it.productId] = (sv[it.productId]||0)+(it.fromVenda!=null?it.fromVenda:it.qty);
        sp[it.productId] = (sp[it.productId]||0)+(it.fromPrincipal||0);
      });
      return {...d, stockVenda: sv, stockPrincipal: sp, orders: d.orders.filter(o=>o.id!==order.id)};
    });
  };

  return (
    <div>
      <h1 className="page-title">Pedidos de Clientes</h1>
      <div className="page-sub">Monte o pedido puxando produto e preço de venda direto do estoque (Principal ou Área de Venda), acompanhe o status e gere um PDF com seus dados e os do cliente.</div>
      <div className="toolbar"><div/><button type="button" className="btn" onClick={()=>{setError(''); setForm(blank); setModal(true);}}>+ Novo pedido</button></div>
      <div className="card">
        {db.orders.length===0 ? <div className="empty">Nenhum pedido registrado.</div> :
        <table><thead><tr><th>Data</th><th>Cliente</th><th>Itens</th><th>Total</th><th>Status</th><th></th></tr></thead>
        <tbody>{[...db.orders].reverse().map(o=>(
          <React.Fragment key={o.id}>
          <tr>
            <td>{o.date}</td><td>{(o.clientSnapshot||{}).name || '—'}</td>
            <td className="muted">{o.items.map(i=>`${i.name} (${i.qty} ${i.unit})`).join(', ')}</td>
            <td>{money(o.total)}</td>
            <td>
              <select value={o.status||'Recebido'} onChange={e=>setStage(o, e.target.value)}>
                {ORDER_STAGES.map(s=><option key={s} value={s}>{s}</option>)}
              </select>
            </td>
            <td style={{display:'flex', gap:6, flexWrap:'wrap'}}>
              <button type="button" className="btn small outline" onClick={()=>openEdit(o)}>Editar itens</button>
              <button type="button" className="btn small outline" onClick={()=>setPdfPreview(generateOrderPdf(o, db.company))}>PDF</button>
              <a className="btn small outline" href={buildOrderWhatsAppLink(o, db.company)} target="_blank" rel="noopener noreferrer">📲 WhatsApp</a>
              <ConfirmButton onConfirm={()=>removeOrder(o)}/>
            </td>
          </tr>
          {rowErrors[o.id] && <tr><td colSpan="6" className="muted" style={{color:'var(--red)'}}>{rowErrors[o.id]}</td></tr>}
          </React.Fragment>
        ))}</tbody></table>}
      </div>

      {modal && <Modal title="Novo pedido" wide onClose={()=>setModal(false)}>
        <div className="row2">
          <Field label="Cliente"><select value={form.clientId} onChange={e=>setForm({...form,clientId:e.target.value})}>
            <option value="">Selecione...</option>
            <option value="__new__">+ Novo cliente rápido (só nome)</option>
            {db.clients.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
          </select></Field>
          <Field label="Data"><input type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/></Field>
        </div>
        {isNewClient && <>
          <Field label="Nome do cliente"><input value={form.newClientName} onChange={e=>setForm({...form,newClientName:e.target.value})} placeholder="Ex: Hamburgueria GG"/></Field>
          <div className="muted" style={{marginBottom:10}}>Depois dá pra completar endereço, telefone e documento na aba "Clientes".</div>
        </>}

        <label className="field" style={{fontFamily:"'Helvetica Neue',sans-serif", fontSize:11, color:'var(--ink-soft)', textTransform:'uppercase'}}>Itens do pedido (Estoque Principal ou Área de Venda)</label>
        {form.items.map((it,i)=>(
          <div key={it.tempId} className="ing-row">
            <select value={it.productId} onChange={e=>setItem(i,'productId',e.target.value)}>
              <option value="">Selecione o produto...</option>
              {db.products.map(pr=><option key={pr.id} value={pr.id}>{pr.name} (disp.: {totalAvailable(pr.id)} {pr.unit})</option>)}
            </select>
            <input type="number" placeholder="qtd" value={it.qty} onChange={e=>setItem(i,'qty',e.target.value)}/>
            <input type="number" step="0.01" placeholder="preço unit." value={it.unitPrice} onChange={e=>setItem(i,'unitPrice',e.target.value)}/>
            <button type="button" className="btn small danger" onClick={()=>removeItem(i)}>×</button>
          </div>
        ))}
        <button type="button" className="btn small outline" onClick={addItem}>+ item</button>

        <div className="muted" style={{margin:'12px 0'}}>Total do pedido: <b style={{color:'var(--green-deep)'}}>{money(orderTotal)}</b></div>
        {error && <div className="muted" style={{color:'var(--red)', marginBottom:8}}>{error}</div>}

        <div className="modal-actions">
          <button type="button" className="btn outline" onClick={()=>setModal(false)}>Cancelar</button>
          <button type="button" className="btn" onClick={save}>Confirmar, dar baixa e gerar PDF</button>
        </div>
      </Modal>}

      {editModal && <Modal title={"Editar itens — "+((editModal.clientSnapshot||{}).name||'Cliente')} wide onClose={()=>setEditModal(null)}>
        <div className="muted" style={{marginBottom:10}}>Ajuste as quantidades ou remova itens que não tem em estoque. O PDF e o link do WhatsApp já saem atualizados com o que ficar aqui.</div>
        <label className="field" style={{fontFamily:"'Helvetica Neue',sans-serif", fontSize:11, color:'var(--ink-soft)', textTransform:'uppercase'}}>Itens do pedido</label>
        {editItems.map((it,i)=>(
          <div key={it.tempId} className="ing-row">
            <select value={it.productId} onChange={e=>setEditItem(i,'productId',e.target.value)}>
              <option value="">Selecione o produto...</option>
              {db.products.map(pr=><option key={pr.id} value={pr.id}>{pr.name} (disp.: {totalAvailable(pr.id)} {pr.unit})</option>)}
            </select>
            <input type="number" placeholder="qtd" value={it.qty} onChange={e=>setEditItem(i,'qty',e.target.value)}/>
            <input type="number" step="0.01" placeholder="preço unit." value={it.unitPrice} onChange={e=>setEditItem(i,'unitPrice',e.target.value)}/>
            <button type="button" className="btn small danger" onClick={()=>removeEditItem(i)}>×</button>
          </div>
        ))}
        <button type="button" className="btn small outline" onClick={addEditItem}>+ item</button>

        <div className="muted" style={{margin:'12px 0'}}>Novo total do pedido: <b style={{color:'var(--green-deep)'}}>{money(editTotal)}</b></div>
        {editError && <div className="muted" style={{color:'var(--red)', marginBottom:8}}>{editError}</div>}

        <div className="modal-actions">
          <button type="button" className="btn outline" onClick={()=>setEditModal(null)}>Cancelar</button>
          <button type="button" className="btn" onClick={saveEdit}>Salvar itens</button>
        </div>
      </Modal>}
      {pdfPreview && <PdfPreviewModal dataUri={pdfPreview.dataUri} filename={pdfPreview.filename} onClose={()=>setPdfPreview(null)}/>}
    </div>
  );
}

function PullProductModal({db, existingIds, onClose, onAdd}){
  const [search, setSearch] = useState('');
  const [category, setCategory] = useState('');
  const [selected, setSelected] = useState({});
  const categories = [...new Set(db.products.map(p=>p.category).filter(Boolean))];
  const filtered = db.products.filter(p=>{
    if(existingIds.includes(p.id)) return false;
    if(category && p.category!==category) return false;
    if(search && !normalizeText(p.name).includes(normalizeText(search))) return false;
    return true;
  });
  const toggle = (id) => setSelected(s=>({...s,[id]:!s[id]}));
  const confirm = () => { onAdd(Object.keys(selected).filter(id=>selected[id])); onClose(); };

  return (
    <Modal title="Puxar produto para precificação" wide onClose={onClose}>
      <div className="row2">
        <Field label="Buscar por nome"><input value={search} onChange={e=>setSearch(e.target.value)}/></Field>
        <Field label="Categoria"><select value={category} onChange={e=>setCategory(e.target.value)}>
          <option value="">Todas</option>
          {categories.map(c=><option key={c} value={c}>{c}</option>)}
        </select></Field>
      </div>
      <div style={{maxHeight:320, overflow:'auto', border:'1px solid var(--line)', borderRadius:8}}>
        {filtered.length===0 ? <div className="empty">Nenhum produto encontrado (ou todos já estão na lista).</div> :
        filtered.map(p=>(
          <label key={p.id} style={{display:'flex', alignItems:'center', gap:10, padding:'8px 12px', borderBottom:'1px solid var(--line)', cursor:'pointer'}}>
            <input type="checkbox" checked={!!selected[p.id]} onChange={()=>toggle(p.id)}/>
            <span style={{flex:1}}>{p.name}</span>
            <span className="muted">{p.type||'Insumo'} · {p.unit}</span>
          </label>
        ))}
      </div>
      <div className="modal-actions">
        <button type="button" className="btn outline" onClick={onClose}>Cancelar</button>
        <button type="button" className="btn" onClick={confirm}>Adicionar selecionados</button>
      </div>
    </Modal>
  );
}

function Precificacao({db, setDB}){
  const [pullModal, setPullModal] = useState(false);
  const [pdfPreview, setPdfPreview] = useState(null);
  const [configForm, setConfigForm] = useState(db.pricingConfig);
  const [toast, setToast] = useState('');

  const flash = (msg) => { setToast(msg); setTimeout(()=>setToast(''), 2500); };
  const saveConfig = () => { setDB(d=>({...d, pricingConfig: configForm})); flash('Configurações padrão salvas.'); };

  const addProducts = (ids) => {
    setDB(d => {
      const cfg = d.pricingConfig;
      const newItems = ids.map(id => ({id: uid(), productId:id, useDefaults:true, notForSale:false,
        lossPct:cfg.lossPct, laborPct:cfg.laborPct, energyPct:cfg.energyPct, taxPct:cfg.taxPct,
        packagingValue:cfg.packagingValue, marginPct:cfg.marginPct}));
      return {...d, pricingItems:[...d.pricingItems, ...newItems]};
    });
  };
  const removeItem = (id) => setDB(d=>({...d, pricingItems: d.pricingItems.filter(i=>i.id!==id)}));
  const updateItem = (id, patch) => setDB(d=>({...d, pricingItems: d.pricingItems.map(i=>i.id===id?{...i,...patch}:i)}));

  const computed = useMemo(() => db.pricingItems.map(item => {
    const product = db.products.find(p=>p.id===item.productId);
    if(!product) return null;
    const recipe = db.recipes.find(r=>r.outputProductId===product.id);
    const isFabricado = !!recipe;
    let custoBase = 0;
    if(recipe){
      const cost = recipe.ingredients.reduce((a,i)=>{ const p=db.products.find(x=>x.id===i.productId); return a+(p?p.costPrice*i.qty:0); },0);
      custoBase = recipe.yieldQty ? cost/recipe.yieldQty : 0;
    } else {
      custoBase = product.costPrice||0;
    }
    const cfg = item.useDefaults ? db.pricingConfig : item;
    const minMargin = item.useDefaults ? db.pricingConfig.minMarginPct : (item.minMarginPct!=null ? item.minMarginPct : db.pricingConfig.minMarginPct);
    const perdas = custoBase*(cfg.lossPct||0)/100;
    const maoObra = custoBase*(cfg.laborPct||0)/100;
    const energia = custoBase*(cfg.energyPct||0)/100;
    const impostos = custoBase*(cfg.taxPct||0)/100;
    const embalagem = cfg.packagingValue||0;
    const custoTotal = custoBase+perdas+maoObra+energia+impostos+embalagem;
    const margin = cfg.marginPct||0;
    const precoSugerido = margin<100 ? custoTotal/(1-margin/100) : custoTotal;
    const precoAtual = product.salePrice||0;
    const lucroR = precoSugerido - custoTotal;
    const lucroPct = precoSugerido>0 ? (lucroR/precoSugerido*100) : 0;
    const margemAtual = precoAtual>0 ? ((precoAtual-custoTotal)/precoAtual*100) : -999;
    const markup = custoTotal>0 ? ((precoSugerido-custoTotal)/custoTotal*100) : 0;
    let status = 'red';
    if(margemAtual >= margin) status='green';
    else if(margemAtual >= minMargin) status='yellow';
    return {item, product, isFabricado, custoBase, perdas, maoObra, energia, impostos, embalagem, custoTotal,
      margin, minMargin, precoSugerido, precoAtual, lucroR, lucroPct, margemAtual, markup, status};
  }).filter(Boolean), [db]);

  const applyPrice = (row) => {
    setDB(d => ({...d, products: d.products.map(p=>p.id===row.product.id?{...p, salePrice: Math.round(row.precoSugerido*100)/100}:p)}));
    flash(`Preço de "${row.product.name}" atualizado para ${money(row.precoSugerido)}.`);
  };
  const applyAll = () => {
    const applicable = computed.filter(r=>!r.item.notForSale);
    if(applicable.length===0) return;
    setDB(d => ({...d, products: d.products.map(p => {
      const row = applicable.find(c=>c.product.id===p.id);
      return row ? {...p, salePrice: Math.round(row.precoSugerido*100)/100} : p;
    })}));
    flash('Preços sugeridos aplicados aos itens marcados como "vendido" na lista.');
  };

  const setMarginQuick = (row, pct) => {
    const base = row.item.useDefaults ? db.pricingConfig : row.item;
    updateItem(row.item.id, {useDefaults:false, marginPct:pct,
      lossPct:base.lossPct, laborPct:base.laborPct, energyPct:base.energyPct, taxPct:base.taxPct, packagingValue:base.packagingValue});
  };

  const exportPdf = () => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFillColor(30,55,33); doc.rect(0,0,210,22,'F');
    doc.setTextColor(255,255,255); doc.setFontSize(15); doc.text('Precificação de Produtos', 14, 14);
    doc.setTextColor(30,30,30);
    const rows = computed.map(r => [r.product.name, r.isFabricado?'Produção':'Revenda', r.item.notForSale?'Não vendido':'', money(r.custoTotal), r.margin+'%', money(r.precoAtual), money(r.precoSugerido), money(r.lucroR)]);
    doc.autoTable({ startY:30, head:[['Produto','Tipo','Obs.','Custo Total','Margem','Preço Atual','Preço Sugerido','Lucro R$']],
      body: rows, headStyles:{fillColor:[47,82,51]}, styles:{fontSize:9} });
    setPdfPreview({ dataUri: doc.output('datauristring'), filename: 'precificacao.pdf' });
  };

  return (
    <div>
      <h1 className="page-title">Precificação</h1>
      <div className="page-sub">Sugere preço de venda a partir dos custos já cadastrados (fichas técnicas para produção própria, custo de compra para revenda). Não altera receitas nem fichas técnicas.</div>

      <div className="card">
        <h2>Configurações padrão</h2>
        <div className="grid-3">
          <Field label="Perdas (%)"><input type="number" value={configForm.lossPct} onChange={e=>setConfigForm({...configForm, lossPct:parseFloat(e.target.value)||0})}/></Field>
          <Field label="Mão de Obra (%)"><input type="number" value={configForm.laborPct} onChange={e=>setConfigForm({...configForm, laborPct:parseFloat(e.target.value)||0})}/></Field>
          <Field label="Energia/Gás (%)"><input type="number" value={configForm.energyPct} onChange={e=>setConfigForm({...configForm, energyPct:parseFloat(e.target.value)||0})}/></Field>
        </div>
        <div className="grid-3">
          <Field label="Impostos (%)"><input type="number" value={configForm.taxPct} onChange={e=>setConfigForm({...configForm, taxPct:parseFloat(e.target.value)||0})}/></Field>
          <Field label="Embalagem padrão (R$)"><input type="number" step="0.01" value={configForm.packagingValue} onChange={e=>setConfigForm({...configForm, packagingValue:parseFloat(e.target.value)||0})}/></Field>
          <Field label="Margem de lucro padrão (%)"><input type="number" value={configForm.marginPct} onChange={e=>setConfigForm({...configForm, marginPct:parseFloat(e.target.value)||0})}/></Field>
        </div>

        <div className="card" style={{background:'var(--cream)', marginTop:6}}>
          <h2 style={{fontSize:13}}>Margem mínima aceitável</h2>
          <div className="muted" style={{marginBottom:10}}>
            É o piso abaixo do qual você não quer vender de jeito nenhum — mesmo com desconto ou negociação. Diferente da "margem padrão" (a meta ideal), a margem mínima é a linha vermelha. Comece testando valores baixos (5%, 10%) e vá subindo até um ponto que ainda cobre seus custos com folga confortável, considerando que produtos perecíveis ou muito concorridos costumam precisar de margem mínima menor, e itens exclusivos ou sob encomenda podem sustentar uma margem mínima maior.
          </div>
          <Field label="Margem mínima (%)"><input type="number" value={configForm.minMarginPct} onChange={e=>setConfigForm({...configForm, minMarginPct:parseFloat(e.target.value)||0})}/></Field>
          <div style={{display:'flex', gap:6, flexWrap:'wrap', marginTop:8}}>
            {[5,10,15,20,25,30].map(pct=>(
              <button type="button" key={pct} className={"btn small "+(configForm.minMarginPct===pct?'gold':'outline')} onClick={()=>setConfigForm({...configForm, minMarginPct:pct})}>{pct}%</button>
            ))}
          </div>
        </div>

        <button type="button" className="btn small" style={{marginTop:12}} onClick={saveConfig}>Salvar configurações padrão</button>
        <div className="muted" style={{marginTop:6}}>Vale para produtos novos puxados para a lista, ou para qualquer item que esteja usando "configuração padrão". Cada produto pode ter seus próprios valores, se preferir.</div>
      </div>

      <div className="toolbar">
        <div/>
        <div style={{display:'flex', gap:8, flexWrap:'wrap'}}>
          <button type="button" className="btn outline" onClick={()=>setPullModal(true)}>📥 Puxar Produto</button>
          <button type="button" className="btn outline" onClick={()=>flash('Custos recalculados a partir das fichas técnicas e compras atuais.')}>🔄 Atualizar Custos</button>
          <button type="button" className="btn gold" onClick={applyAll}>✅ Aplicar Preço (todos vendidos)</button>
          <button type="button" className="btn" onClick={exportPdf}>📄 Exportar PDF</button>
        </div>
      </div>
      {toast && <div className="muted" style={{color:'var(--green-deep)', marginBottom:10}}>{toast}</div>}

      {computed.length===0 ? <div className="card"><div className="empty">Nenhum produto na precificação ainda. Clique em "📥 Puxar Produto" para começar.</div></div> :
      computed.map(row => (
        <div className="card" key={row.item.id} style={row.item.notForSale?{opacity:0.6}:{}}>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', flexWrap:'wrap', gap:8}}>
            <div>
              <b>{row.product.name}</b>{' '}
              <span className={"badge "+(row.isFabricado?'ok':'warn')}>{row.isFabricado?'Produção':'Revenda'}</span>{' '}
              {row.item.notForSale
                ? <span className="badge low">Não vendido (uso interno)</span>
                : <span className={"badge "+(row.status==='green'?'ok':row.status==='yellow'?'warn':'low')}>
                    {row.status==='green'?'Margem saudável':row.status==='yellow'?'Margem no limite':'Abaixo do mínimo'}
                  </span>}
            </div>
            <ConfirmButton onConfirm={()=>removeItem(row.item.id)}/>
          </div>

          <label style={{display:'flex', alignItems:'center', gap:6, fontFamily:"'Helvetica Neue',sans-serif", fontSize:12, margin:'10px 0', cursor:'pointer'}}>
            <input type="checkbox" checked={!!row.item.notForSale} onChange={e=>updateItem(row.item.id,{notForSale:e.target.checked})}/>
            Este produto não é vendido diretamente (ex: farinha, insumo só para produção) — não aplicar preço de venda
          </label>

          {!row.item.notForSale && <>
            <div className="grid-4" style={{marginTop:4}}>
              <div className="stat"><div className="label">Custo Total</div><div className="value" style={{fontSize:17}}>{money(row.custoTotal)}</div></div>
              <div className="stat"><div className="label">Preço Atual</div><div className="value" style={{fontSize:17}}>{money(row.precoAtual)}</div></div>
              <div className="stat"><div className="label">Preço Sugerido</div><div className="value gold" style={{fontSize:17}}>{money(row.precoSugerido)}</div></div>
              <div className="stat"><div className="label">Lucro (no sugerido)</div><div className="value" style={{fontSize:17}}>{money(row.lucroR)} <span className="muted" style={{fontSize:12}}>({row.lucroPct.toFixed(1)}%)</span></div></div>
            </div>

            <table style={{marginTop:12}}>
              <thead><tr><th>Custo Base</th><th>Perdas</th><th>Mão de Obra</th><th>Energia/Gás</th><th>Impostos</th><th>Embalagem</th><th>Markup</th></tr></thead>
              <tbody><tr>
                <td>{money(row.custoBase)}</td><td>{money(row.perdas)}</td><td>{money(row.maoObra)}</td>
                <td>{money(row.energia)}</td><td>{money(row.impostos)}</td><td>{money(row.embalagem)}</td><td>{row.markup.toFixed(1)}%</td>
              </tr></tbody>
            </table>
            <div className="muted" style={{margin:'8px 0 4px 0', fontStyle:'italic'}}>
              Lucro bruto é o que sobra da venda depois de pagar o custo direto de produzir ou comprar o produto, mais todos esses custos e despesas operacionais somados (perdas, mão de obra, energia/gás, impostos, embalagem). É esse valor — não o preço de venda — que efetivamente fica pra você.
            </div>

            <div className="muted" style={{margin:'10px 0 6px 0'}}>Margem alvo: <b>{row.margin}%</b> · Margem mínima: <b>{row.minMargin}%</b> — simulador rápido de margem alvo:</div>
            <div style={{display:'flex', gap:6, flexWrap:'wrap', marginBottom:10}}>
              {[50,60,70,80,90].map(pct=>(
                <button type="button" key={pct} className={"btn small "+(row.margin===pct?'gold':'outline')} onClick={()=>setMarginQuick(row,pct)}>{pct}%</button>

            <label style={{display:'flex', alignItems:'center', gap:6, fontFamily:"'Helvetica Neue',sans-serif", fontSize:12, marginBottom:8, cursor:'pointer'}}>
              <input type="checkbox" checked={!row.item.useDefaults} onChange={e=>{
                if(e.target.checked){
                  updateItem(row.item.id, {useDefaults:false, lossPct:db.pricingConfig.lossPct, laborPct:db.pricingConfig.laborPct,
                    energyPct:db.pricingConfig.energyPct, taxPct:db.pricingConfig.taxPct, packagingValue:db.pricingConfig.packagingValue, marginPct:row.item.marginPct});
                } else {
                  updateItem(row.item.id, {useDefaults:true});
                }
              }}/>
              Personalizar parâmetros deste produto (em vez da configuração padrão)
            </label>

            {!row.item.useDefaults && (
              <div className="grid-3" style={{marginBottom:6}}>
                <Field label="Perdas (%)"><input type="number" value={row.item.lossPct} onChange={e=>updateItem(row.item.id,{lossPct:parseFloat(e.target.value)||0})}/></Field>
                <Field label="Mão de obra (%)"><input type="number" value={row.item.laborPct} onChange={e=>updateItem(row.item.id,{laborPct:parseFloat(e.target.value)||0})}/></Field>
                <Field label="Energia/Gás (%)"><input type="number" value={row.item.energyPct} onChange={e=>updateItem(row.item.id,{energyPct:parseFloat(e.target.value)||0})}/></Field>
                <Field label="Impostos (%)"><input type="number" value={row.item.taxPct} onChange={e=>updateItem(row.item.id,{taxPct:parseFloat(e.target.value)||0})}/></Field>
                <Field label="Embalagem (R$)"><input type="number" step="0.01" value={row.item.packagingValue} onChange={e=>updateItem(row.item.id,{packagingValue:parseFloat(e.target.value)||0})}/></Field>
                <Field label="Margem (%)"><input type="number" value={row.item.marginPct} onChange={e=>updateItem(row.item.id,{marginPct:parseFloat(e.target.value)||0})}/></Field>
              </div>
            )}

            <button type="button" className="btn small" onClick={()=>applyPrice(row)}>✅ Aplicar preço sugerido a este produto</button>
          </>}
        </div>
      ))}

      {pullModal && <PullProductModal db={db} existingIds={db.pricingItems.map(i=>i.productId)} onClose={()=>setPullModal(false)} onAdd={addProducts}/>}
      {pdfPreview && <PdfPreviewModal dataUri={pdfPreview.dataUri} filename={pdfPreview.filename} onClose={()=>setPdfPreview(null)}/>}
    </div>
  );
}

// ---------- RELATÓRIOS ----------
function Relatorios({db}){
  const [period, setPeriod] = useState({type:'mes'});
  const range = getPeriodRange(period);
  const [pdfPreview, setPdfPreview] = useState(null);

  const totalCost = db.products.reduce((a,p)=>a+((db.stockPrincipal[p.id]||0)+(db.stockProducao[p.id]||0)+(db.stockVenda[p.id]||0))*p.costPrice,0);
  const totalSale = db.products.reduce((a,p)=>a+(db.stockVenda[p.id]||0)*p.salePrice,0);

  const producaoPeriodo = db.products.map(p=>{
    const rel = db.productionOrders.filter(o=>o.outputProductId===p.id && inPeriod(o.date, range));
    if(rel.length===0) return null;
    return {name:p.name, unit:p.unit, qty: rel.reduce((a,o)=>a+o.qty,0), cost: rel.reduce((a,o)=>a+o.cost,0)};
  }).filter(Boolean);

  const ajustesPeriodo = db.adjustments.filter(a=>inPeriod(a.date, range));

  const comprasPeriodo = db.purchases.filter(c=>inPeriod(c.date, range));
  const comprasByProduct = {};
  comprasPeriodo.forEach(c=>{
    const p = db.products.find(x=>x.id===c.productId);
    if(!comprasByProduct[c.productId]) comprasByProduct[c.productId] = {name:p?p.name:'—', unit:p?p.unit:'', qty:0, total:0};
    comprasByProduct[c.productId].qty += c.qty;
    comprasByProduct[c.productId].total += c.total;
  });
  const comprasList = Object.values(comprasByProduct).sort((a,b)=>b.total-a.total);
  const comprasTotalPeriodo = comprasPeriodo.reduce((a,c)=>a+c.total,0);

  const pedidosPeriodo = db.orders.filter(o=>inPeriod(o.date, range));
  const pedidosByProduct = {};
  pedidosPeriodo.forEach(o=>o.items.forEach(it=>{
    if(!pedidosByProduct[it.productId]) pedidosByProduct[it.productId] = {name:it.name, unit:it.unit, qty:0, total:0};
    pedidosByProduct[it.productId].qty += it.qty;
    pedidosByProduct[it.productId].total += it.total;
  }));
  const pedidosList = Object.values(pedidosByProduct).sort((a,b)=>b.total-a.total);
  const pedidosTotalPeriodo = pedidosPeriodo.reduce((a,o)=>a+o.total,0);

  const exportPdf = () => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFillColor(30,55,33); doc.rect(0,0,210,22,'F');
    doc.setTextColor(255,255,255); doc.setFontSize(15); doc.text('Relatório da Padaria', 14, 14);
    doc.setTextColor(30,30,30); doc.setFontSize(9);
    doc.text(`Período: ${range.start} a ${range.end}`, 14, 28);

    let y = 34;
    doc.setFontSize(11); doc.text('Estoque consolidado (atual)', 14, y); y += 4;
    doc.autoTable({ startY:y, head:[['Produto','Principal','Produção','Venda','Vlr. custo','Vlr. venda']],
      body: db.products.map(p=>{
        const qp=db.stockPrincipal[p.id]||0, qprod=db.stockProducao[p.id]||0, qv=db.stockVenda[p.id]||0;
        return [p.name, qp, qprod, qv, money((qp+qprod+qv)*p.costPrice), money(qv*p.salePrice)];
      }), headStyles:{fillColor:[47,82,51]}, styles:{fontSize:8} });
    y = doc.lastAutoTable.finalY + 10;

    doc.setFontSize(11); doc.text('Compras no período', 14, y); y += 4;
    doc.autoTable({ startY:y, head:[['Produto','Qtd. comprada','Valor']],
      body: comprasList.length ? comprasList.map(c=>[c.name, `${c.qty} ${c.unit}`, money(c.total)]) : [['—','—','—']],
      headStyles:{fillColor:[47,82,51]}, styles:{fontSize:8} });
    y = doc.lastAutoTable.finalY + 10;

    doc.setFontSize(11); doc.text('Produção no período', 14, y); y += 4;
    doc.autoTable({ startY:y, head:[['Produto','Qtd. produzida','Custo']],
      body: producaoPeriodo.length ? producaoPeriodo.map(p=>[p.name, `${p.qty} ${p.unit}`, money(p.cost)]) : [['—','—','—']],
      headStyles:{fillColor:[47,82,51]}, styles:{fontSize:8} });
    y = doc.lastAutoTable.finalY + 10;

    doc.setFontSize(11); doc.text('Pedidos no período', 14, y); y += 4;
    doc.autoTable({ startY:y, head:[['Produto','Qtd. vendida','Valor']],
      body: pedidosList.length ? pedidosList.map(p=>[p.name, `${p.qty} ${p.unit}`, money(p.total)]) : [['—','—','—']],
      headStyles:{fillColor:[47,82,51]}, styles:{fontSize:8} });
    y = doc.lastAutoTable.finalY + 10;

    doc.setFontSize(11); doc.text('Ajustes / perdas no período', 14, y); y += 4;
    doc.autoTable({ startY:y, head:[['Produto','Local','Qtd.','Motivo','Valor']],
      body: ajustesPeriodo.length ? ajustesPeriodo.map(a=>{
        const p = db.products.find(x=>x.id===a.productId);
        return [p?p.name:'—', a.location, a.qty, a.reason, money(p?a.qty*p.costPrice:0)];
      }) : [['—','—','—','—','—']],
      headStyles:{fillColor:[47,82,51]}, styles:{fontSize:8} });

    setPdfPreview({dataUri: doc.output('datauristring'), filename: `relatorio-${range.start}-a-${range.end}.pdf`});
  };

  return (
    <div>
      <h1 className="page-title">Relatórios</h1>
      <div className="page-sub">Resumo de compras, produção, pedidos e estoque — o estoque consolidado é sempre a posição atual; os demais respeitam o período escolhido.</div>

      <PeriodSelector period={period} setPeriod={setPeriod}/>
      <div className="toolbar"><div/><button type="button" className="btn" onClick={exportPdf}>📄 Exportar PDF do relatório</button></div>

      <div className="card">
        <h2>Estoque consolidado (posição atual)</h2>
        <table><thead><tr><th>Produto</th><th>Principal</th><th>Produção</th><th>Venda</th><th>Total</th><th>Vlr. custo</th><th>Vlr. venda</th></tr></thead>
        <tbody>{db.products.map(p=>{
          const qp = db.stockPrincipal[p.id]||0, qprod = db.stockProducao[p.id]||0, qv = db.stockVenda[p.id]||0;
          return <tr key={p.id}><td>{p.name}</td><td>{qp}</td><td>{qprod}</td><td>{qv}</td><td>{qp+qprod+qv}</td><td>{money((qp+qprod+qv)*p.costPrice)}</td><td>{money(qv*p.salePrice)}</td></tr>;
        })}</tbody></table>
        <div className="muted" style={{marginTop:8}}>Valor total investido: {money(totalCost)} · Valor potencial de venda: {money(totalSale)}</div>
      </div>

      <div className="card">
        <h2>Compras no período</h2>
        <div className="muted" style={{marginBottom:10}}>{comprasPeriodo.length} compra(s) · total de {money(comprasTotalPeriodo)}</div>
        {comprasList.length===0 ? <div className="empty">Nenhuma compra neste período.</div> :
        <table><thead><tr><th>Produto</th><th>Qtd. comprada</th><th>Valor</th></tr></thead>
        <tbody>{comprasList.map((c,i)=>(
          <tr key={i}><td>{c.name}</td><td>{c.qty.toLocaleString('pt-BR',{maximumFractionDigits:3})} {c.unit}</td><td>{money(c.total)}</td></tr>
        ))}</tbody></table>}
      </div>

      <div className="card">
        <h2>Produção no período</h2>
        {producaoPeriodo.length===0 ? <div className="empty">Nenhuma produção neste período.</div> :
        <table><thead><tr><th>Produto</th><th>Qtd. produzida</th><th>Custo total</th></tr></thead>
        <tbody>{producaoPeriodo.map((p,i)=>(
          <tr key={i}><td>{p.name}</td><td>{p.qty} {p.unit}</td><td>{money(p.cost)}</td></tr>
        ))}</tbody></table>}
      </div>

      <div className="card">
        <h2>Pedidos no período</h2>
        <div className="muted" style={{marginBottom:10}}>{pedidosPeriodo.length} pedido(s) · total de {money(pedidosTotalPeriodo)}</div>
        {pedidosList.length===0 ? <div className="empty">Nenhum pedido neste período.</div> :
        <table><thead><tr><th>Produto</th><th>Qtd. vendida</th><th>Valor</th></tr></thead>
        <tbody>{pedidosList.map((p,i)=>(
          <tr key={i}><td>{p.name}</td><td>{p.qty.toLocaleString('pt-BR',{maximumFractionDigits:3})} {p.unit}</td><td>{money(p.total)}</td></tr>
        ))}</tbody></table>}
      </div>

      <div className="card">
        <h2>Ajustes de estoque no período (perdas, quebras, uso não comercial)</h2>
        {ajustesPeriodo.length===0 ? <div className="empty">Nenhum ajuste neste período.</div> :
        <table><thead><tr><th>Produto</th><th>Local</th><th>Qtd. baixada</th><th>Motivo</th><th>Valor perdido</th></tr></thead>
        <tbody>{[...ajustesPeriodo].reverse().map(a=>{
          const p = db.products.find(x=>x.id===a.productId);
          return <tr key={a.id}><td>{p?p.name:'—'}</td><td>{a.location}</td><td>{a.qty}</td><td>{a.reason}</td><td>{money(p?a.qty*p.costPrice:0)}</td></tr>;
        })}</tbody></table>}
      </div>

      {pdfPreview && <PdfPreviewModal dataUri={pdfPreview.dataUri} filename={pdfPreview.filename} onClose={()=>setPdfPreview(null)}/>}
    </div>
  );
}

// ---------- APP ----------
function SupabaseSetupScreen({onSaved}){
  const cfg = getSupabaseConfig();
  const [url, setUrl] = useState(cfg.url);
  const [key, setKey] = useState(cfg.key);
  const [error, setError] = useState('');
  const save = () => {
    if(!url.trim() || !key.trim()){ setError('Preencha os dois campos.'); return; }
    saveSupabaseConfig(url.trim(), key.trim());
    onSaved();
  };
  return (
    <div style={{minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', background:'var(--cream)'}}>
      <div className="card" style={{maxWidth:440}}>
        <h2>Conectar ao Supabase</h2>
        <div className="muted" style={{marginBottom:12}}>Cole aqui a URL e a chave "anon public" do seu projeto (em Project Settings → API no painel do Supabase). Fica guardado só neste navegador.</div>
        <Field label="Project URL"><input value={url} onChange={e=>setUrl(e.target.value)} placeholder="https://xxxx.supabase.co"/></Field>
        <Field label="anon public key"><input value={key} onChange={e=>setKey(e.target.value)}/></Field>
        {error && <div className="muted" style={{color:'var(--red)', marginBottom:8}}>{error}</div>}
        <button type="button" className="btn" onClick={save}>Salvar e continuar</button>
      </div>
    </div>
  );
}

function AuthScreen(){
  const [authMode, setAuthMode] = useState('login'); // 'login' | 'signup' | 'forgot'
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [password2, setPassword2] = useState('');
  const [error, setError] = useState('');
  const [info, setInfo] = useState('');
  const [loading, setLoading] = useState(false);

  const doLogin = async () => {
    setError(''); setInfo(''); setLoading(true);
    const sb = getSupabaseClient();
    const {error} = await sb.auth.signInWithPassword({email, password});
    setLoading(false);
    if(error) setError(error.message);
  };
  const doSignup = async () => {
    setError(''); setInfo(''); setLoading(true);
    if(password!==password2){ setError('As senhas não coincidem.'); setLoading(false); return; }
    const sb = getSupabaseClient();
    const {error} = await sb.auth.signUp({email, password});
    setLoading(false);
    if(error){ setError(error.message); return; }
    setInfo('Conta criada! Se a confirmação de e-mail estiver ativada no seu projeto, confira sua caixa de entrada antes de entrar.');
    setAuthMode('login');
  };
  const doForgot = async () => {
    setError(''); setInfo(''); setLoading(true);
    const sb = getSupabaseClient();
    const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo: window.location.href});
    setLoading(false);
    if(error){ setError(error.message); return; }
    setInfo('Enviamos um e-mail com o link pra redefinir sua senha. Confira sua caixa de entrada (e o spam).');
  };

  return (
    <div style={{minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', background:'var(--cream)'}}>
      <div className="card" style={{maxWidth:380, width:'100%'}}>
        <h2>{authMode==='login' ? 'Entrar como administrador' : authMode==='signup' ? 'Criar conta de administrador' : 'Recuperar senha'}</h2>
        <Field label="E-mail"><input type="email" value={email} onChange={e=>setEmail(e.target.value)}/></Field>
        {authMode!=='forgot' && <Field label="Senha"><input type="password" value={password} onChange={e=>setPassword(e.target.value)}/></Field>}
        {authMode==='signup' && <Field label="Confirmar senha"><input type="password" value={password2} onChange={e=>setPassword2(e.target.value)}/></Field>}
        {error && <div className="muted" style={{color:'var(--red)', marginBottom:8}}>{error}</div>}
        {info && <div className="muted" style={{color:'var(--green-deep)', marginBottom:8}}>{info}</div>}
        {authMode==='login' && <button type="button" className="btn" onClick={doLogin} disabled={loading}>{loading?'Entrando...':'Entrar'}</button>}
        {authMode==='signup' && <button type="button" className="btn" onClick={doSignup} disabled={loading}>{loading?'Criando...':'Criar conta'}</button>}
        {authMode==='forgot' && <button type="button" className="btn" onClick={doForgot} disabled={loading}>{loading?'Enviando...':'Enviar e-mail de recuperação'}</button>}
        <div style={{marginTop:14, display:'flex', flexDirection:'column', gap:6}}>
          {authMode==='login' && <>
            <button type="button" className="btn small outline" onClick={()=>{setAuthMode('forgot'); setError(''); setInfo('');}}>Esqueci minha senha</button>
            <button type="button" className="btn small outline" onClick={()=>{setAuthMode('signup'); setError(''); setInfo('');}}>Criar conta (primeira vez usando)</button>
          </>}
          {authMode!=='login' && <button type="button" className="btn small outline" onClick={()=>{setAuthMode('login'); setError(''); setInfo('');}}>Voltar pro login</button>}
        </div>
      </div>
    </div>
  );
}

function RecoveryScreen({onDone}){
  const [password, setPassword] = useState('');
  const [password2, setPassword2] = useState('');
  const [error, setError] = useState('');
  const save = async () => {
    setError('');
    if(!password || password.length<6){ setError('Use pelo menos 6 caracteres.'); return; }
    if(password!==password2){ setError('As senhas não coincidem.'); return; }
    const sb = getSupabaseClient();
    const {error} = await sb.auth.updateUser({password});
    if(error){ setError(error.message); return; }
    onDone();
  };
  return (
    <div style={{minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', background:'var(--cream)'}}>
      <div className="card" style={{maxWidth:380}}>
        <h2>Você pediu pra redefinir a senha</h2>
        <div className="muted" style={{marginBottom:12}}>Defina a nova senha abaixo.</div>
        <Field label="Nova senha"><input type="password" value={password} onChange={e=>setPassword(e.target.value)}/></Field>
        <Field label="Confirmar nova senha"><input type="password" value={password2} onChange={e=>setPassword2(e.target.value)}/></Field>
        {error && <div className="muted" style={{color:'var(--red)', marginBottom:8}}>{error}</div>}
        <button type="button" className="btn" onClick={save}>Salvar nova senha</button>
      </div>
    </div>
  );
}

// ---------- CONTA (trocar senha / e-mail) — dentro de Backup ----------
function Conta({session}){
  const [newPassword, setNewPassword] = useState('');
  const [newPassword2, setNewPassword2] = useState('');
  const [pwMsg, setPwMsg] = useState('');
  const [pwError, setPwError] = useState('');
  const [newEmail, setNewEmail] = useState('');
  const [emailMsg, setEmailMsg] = useState('');
  const [emailError, setEmailError] = useState('');

  const changePassword = async () => {
    setPwError(''); setPwMsg('');
    if(!newPassword || newPassword.length<6){ setPwError('Use pelo menos 6 caracteres.'); return; }
    if(newPassword!==newPassword2){ setPwError('As senhas não coincidem.'); return; }
    const sb = getSupabaseClient();
    const {error} = await sb.auth.updateUser({password: newPassword});
    if(error){ setPwError(error.message); return; }
    setPwMsg('Senha alterada com sucesso.'); setNewPassword(''); setNewPassword2('');
  };

  const changeEmail = async () => {
    setEmailError(''); setEmailMsg('');
    if(!newEmail.trim()){ setEmailError('Digite o novo e-mail.'); return; }
    const sb = getSupabaseClient();
    const {error} = await sb.auth.updateUser({email: newEmail.trim()});
    if(error){ setEmailError(error.message); return; }
    setEmailMsg('Enviamos um link de confirmação pro novo e-mail — só troca depois que você confirmar por lá.'); setNewEmail('');
  };

  return (
    <div className="card">
      <h2>Minha conta</h2>
      <div className="muted" style={{marginBottom:10}}>E-mail atual: <b>{session && session.user && session.user.email}</b></div>

      <div className="row2">
        <div>
          <h2 style={{fontSize:13}}>Trocar senha</h2>
          <Field label="Nova senha"><input type="password" value={newPassword} onChange={e=>setNewPassword(e.target.value)}/></Field>
          <Field label="Confirmar nova senha"><input type="password" value={newPassword2} onChange={e=>setNewPassword2(e.target.value)}/></Field>
          {pwError && <div className="muted" style={{color:'var(--red)', marginBottom:8}}>{pwError}</div>}
          {pwMsg && <div className="muted" style={{color:'var(--green-deep)', marginBottom:8}}>{pwMsg}</div>}
          <button type="button" className="btn small" onClick={changePassword}>Salvar nova senha</button>
        </div>
        <div>
          <h2 style={{fontSize:13}}>Trocar e-mail</h2>
          <Field label="Novo e-mail"><input type="email" value={newEmail} onChange={e=>setNewEmail(e.target.value)}/></Field>
          {emailError && <div className="muted" style={{color:'var(--red)', marginBottom:8}}>{emailError}</div>}
          {emailMsg && <div className="muted" style={{color:'var(--green-deep)', marginBottom:8}}>{emailMsg}</div>}
          <button type="button" className="btn small" onClick={changeEmail}>Trocar e-mail</button>
        </div>
      </div>
    </div>
  );
}

function App(){

  const [isRecovery, setIsRecovery] = useState(false);
  const [role, setRole] = useState(null); // null | 'admin' | 'cliente'
  const [tab, setTab] = useState('dashboard');
  const [hashReady, setHashReady] = useState(false);

  const tabs = [
    ['dashboard','Painel'],
    ['produtos','Produtos'],
    ['estoque','Estoque'],
    ['compras','Compras'],
    ['transferencias','Transferências'],
    ['receitas','Fichas Técnicas'],
    ['producao','Produção'],
    ['pedidos','Pedidos'],
    ['clientes','Clientes'],
    ['precificacao','Precificação'],
    ['ajustes','Ajustes de Estoque'],
    ['relatorios','Relatórios'],
    ['empresa','Minha Empresa'],
    ['backup','Backup de Dados'],
  ];
  const tabKeys = tabs.map(([k])=>k);

  // ---- Roteamento por # na URL: cada aba e cada modo viram um link
  // compartilhável (ex: seusite.com/#/precificacao, /#/login, /#/pedido) ----
  useEffect(() => {
    const applyHash = () => {
      const path = decodeURIComponent(window.location.hash.replace(/^#\/?/, ''));
      if(!path){ setRole(null); }
      else if(path === 'login'){ setRole('admin'); }
      else if(path === 'pedido'){ setRole('cliente'); }
      else if(tabKeys.includes(path)){ setRole('admin'); setTab(path); }
      else { setRole(null); }
      setHashReady(true);
    };
    applyHash();
    window.addEventListener('hashchange', applyHash);
    return () => window.removeEventListener('hashchange', applyHash);
  }, []);

  useEffect(() => {
    if(!hashReady || session===undefined) return;
    let route = '';
    if(role === 'cliente') route = 'pedido';
    else if(role === 'admin') route = session ? tab : 'login';
    const newHash = '#/'+route;
    if(window.location.hash !== newHash) window.location.hash = newHash;
  }, [role, tab, session, hashReady]);

  useEffect(() => {
    if(!configReady) return;
    const sb = getSupabaseClient();
    if(!sb) return;
    sb.auth.getSession().then(({data}) => setSession(data.session));
    const {data: sub} = sb.auth.onAuthStateChange((event, sess) => {
      if(event==='PASSWORD_RECOVERY') setIsRecovery(true);
      setSession(sess);
    });
    return () => sub.subscription.unsubscribe();
  }, [configReady]);

  const userId = (session && session.user) ? session.user.id : null;
  const [db, setDB, saving, loadError, saveError, reloadNow] = useDB(userId);

  if(!configReady){
    return <SupabaseSetupScreen onSaved={()=>setConfigReady(true)}/>;
  }

  // ---- Modo cliente: tela cheia, sem menu, sem precisar de sessão ----
  if(role==='cliente'){
    return <ClienteView onExit={()=>setRole(null)}/>;
  }

  // ---- Tela de escolha de papel ----
  if(role===null){
    return (
      <div style={{minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', background:'var(--cream)'}}>
        <div style={{textAlign:'center', maxWidth:380, padding:20}}>
          <div className="brand-mark" style={{margin:'0 auto 12px'}}>J</div>
          <h1 className="page-title" style={{textAlign:'center'}}>Joaquim's</h1>
          <div className="page-sub" style={{textAlign:'center', marginBottom:20}}>Como você quer entrar?</div>
          <div style={{display:'flex', flexDirection:'column', gap:10}}>
            <button type="button" className="btn" onClick={()=>setRole('admin')}>Sou Administrador</button>
            <button type="button" className="btn gold" onClick={()=>setRole('cliente')}>Fazer Pedido (Cliente)</button>
          </div>
        </div>
      </div>
    );
  }

  // ---- role === 'admin' a partir daqui ----
  if(session===undefined){
    return <div style={{padding:40, fontFamily:"'Helvetica Neue',sans-serif", color:'var(--ink-soft)'}}>Carregando...</div>;
  }
  if(isRecovery){
    return <RecoveryScreen onDone={()=>setIsRecovery(false)}/>;
  }
  if(!session){
    return <AuthScreen/>;
  }
  if(db === null){
    return <div style={{padding:40, fontFamily:"'Helvetica Neue',sans-serif", color:'var(--ink-soft)'}}>Carregando dados da padaria... {loadError && <div style={{color:'var(--red)'}}>{loadError}</div>}</div>;
  }

  const logout = async () => {
    const sb = getSupabaseClient();
    await sb.auth.signOut();
    setRole(null);
  };

  return (
    <div className="app">
      <div className="sidebar">
        <div className="brand">
          <div className="brand-mark">J</div>
          <div className="brand-name">Joaquim's</div>
          <div className="brand-sub">Gestão da Padaria</div>
        </div>
        <nav>
          {tabs.map(([key,label]) => (
            <button type="button" key={key} className={tab===key?'active':''} onClick={()=>setTab(key)}>{label}</button>
          ))}
        </nav>
        <div style={{marginTop:'auto', padding:'14px 20px', display:'flex', flexDirection:'column', gap:6}}>
          <button type="button" className="btn small outline" onClick={reloadNow}>🔄 Atualizar pedidos</button>
          <button type="button" className="btn small outline" onClick={()=>setRole('cliente')}>🔀 Ver tela do cliente</button>
          <button type="button" className="btn small outline" onClick={logout}>Sair</button>
        </div>
      </div>
      <div className="main">
        {tab==='dashboard' && <Dashboard db={db}/>}
        {tab==='produtos' && <Produtos db={db} setDB={setDB}/>}
        {tab==='estoque' && <Estoque db={db}/>}
        {tab==='compras' && <Compras db={db} setDB={setDB}/>}
        {tab==='transferencias' && <Transferencias db={db} setDB={setDB}/>}
        {tab==='receitas' && <Receitas db={db} setDB={setDB}/>}
        {tab==='producao' && <Producao db={db} setDB={setDB}/>}
        {tab==='pedidos' && <Pedidos db={db} setDB={setDB}/>}
        {tab==='clientes' && <Clientes db={db} setDB={setDB}/>}
        {tab==='precificacao' && <Precificacao db={db} setDB={setDB}/>}
        {tab==='ajustes' && <Ajustes db={db} setDB={setDB}/>}
        {tab==='relatorios' && <Relatorios db={db}/>}
        {tab==='empresa' && <Empresa db={db} setDB={setDB}/>}
        {tab==='backup' && <>
          <Conta session={session}/>
          <Backup db={db} setDB={setDB}/>
        </>}
      </div>
      <div className={"save-indicator"+(saving?' show':'')}>Salvando...</div>
      {saveError && <div style={{position:'fixed', bottom:16, left:16, right:16, maxWidth:520, margin:'0 auto', background:'#fff0f0', border:'1px solid var(--red)', color:'var(--red)', padding:'10px 14px', borderRadius:8, fontSize:13, zIndex:999}}>⚠ {saveError}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
