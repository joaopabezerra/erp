<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joaquim's — Gestão da Padaria</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --cream:#F5F0E6;
    --paper:#FCFAF5;
    --ink:#2B2620;
    --ink-soft:#6B6152;
    --green:#2F5233;
    --green-deep:#1E3721;
    --gold:#C9A227;
    --gold-soft:#E8D48A;
    --line:#E1D8C4;
    --red:#B3462C;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:'Iowan Old Style','Georgia',serif;}
  .app{display:flex;min-height:100vh;}

  /* Sidebar */
  .sidebar{width:210px;background:var(--green-deep);color:var(--gold-soft);flex-shrink:0;padding:22px 0;display:flex;flex-direction:column;}
  .brand{padding:0 20px 18px 20px;border-bottom:1px solid rgba(232,212,138,.2);margin-bottom:10px;}
  .brand-mark{width:40px;height:40px;border-radius:50%;background:var(--gold);color:var(--green-deep);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;font-family:Georgia,serif;margin-bottom:8px;}
  .brand-name{font-size:15px;letter-spacing:.5px;color:var(--paper);font-weight:600;}
  .brand-sub{font-size:10.5px;color:var(--gold-soft);opacity:.75;font-family:'Helvetica Neue',sans-serif;letter-spacing:.6px;text-transform:uppercase;}
  nav{display:flex;flex-direction:column;gap:1px;}
  nav button{all:unset;cursor:pointer;padding:11px 20px;font-size:13.5px;font-family:'Helvetica Neue',sans-serif;color:var(--gold-soft);opacity:.8;border-left:3px solid transparent;}
  nav button:hover{opacity:1;background:rgba(255,255,255,.04);}
  nav button.active{opacity:1;background:rgba(201,162,39,.14);border-left:3px solid var(--gold);color:var(--paper);font-weight:600;}

  /* Main */
  .main{flex:1;padding:26px 34px;max-width:1180px;}
  h1.page-title{font-size:24px;margin:0 0 4px 0;color:var(--green-deep);}
  .page-sub{font-family:'Helvetica Neue',sans-serif;font-size:12.5px;color:var(--ink-soft);margin-bottom:22px;}

  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:18px;}
  .card h2{font-size:15px;margin:0 0 12px 0;color:var(--green-deep);font-family:'Helvetica Neue',sans-serif;font-weight:700;letter-spacing:.2px;}
  .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;}
  .stat .label{font-family:'Helvetica Neue',sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);}
  .stat .value{font-size:22px;font-weight:700;color:var(--green-deep);margin-top:4px;}
  .stat .value.gold{color:var(--gold);}
  .stat .value.red{color:var(--red);}

  table{width:100%;border-collapse:collapse;font-family:'Helvetica Neue',sans-serif;font-size:13px;}
  th{text-align:left;padding:8px 10px;border-bottom:2px solid var(--line);color:var(--ink-soft);font-size:11px;text-transform:uppercase;letter-spacing:.4px;}
  td{padding:9px 10px;border-bottom:1px solid var(--line);}
  tr:hover td{background:rgba(47,82,51,.03);}
  .empty{padding:22px;text-align:center;color:var(--ink-soft);font-family:'Helvetica Neue',sans-serif;font-size:13px;}

  button.btn{all:unset;cursor:pointer;background:var(--green);color:var(--paper);padding:9px 16px;border-radius:7px;font-family:'Helvetica Neue',sans-serif;font-size:12.5px;font-weight:600;}
  button.btn:hover{background:var(--green-deep);}
  button.btn.gold{background:var(--gold);color:var(--green-deep);}
  button.btn.gold:hover{background:var(--gold-soft);}
  button.btn.outline{background:transparent;color:var(--green);border:1px solid var(--green);}
  button.btn.small{padding:5px 10px;font-size:11.5px;}
  button.btn.danger{background:transparent;color:var(--red);}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}

  .modal-bg{position:fixed;inset:0;background:rgba(30,25,15,.45);display:flex;align-items:center;justify-content:center;z-index:50;}
  .modal{background:var(--paper);border-radius:var(--radius);padding:22px 24px;width:460px;max-height:85vh;overflow:auto;}
  .modal h3{margin:0 0 14px 0;color:var(--green-deep);font-family:'Helvetica Neue',sans-serif;}
  .field{margin-bottom:11px;}
  .field label{display:block;font-family:'Helvetica Neue',sans-serif;font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;}
  .field input,.field select{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:6px;font-family:'Helvetica Neue',sans-serif;font-size:13px;background:var(--cream);color:var(--ink);}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .badge{font-family:'Helvetica Neue',sans-serif;font-size:10.5px;padding:2px 8px;border-radius:20px;font-weight:600;}
  .badge.ok{background:rgba(47,82,51,.12);color:var(--green-deep);}
  .badge.low{background:rgba(179,70,44,.12);color:var(--red);}
  .badge.warn{background:rgba(201,162,39,.18);color:#8a6d10;}
  .ing-row{display:flex;gap:8px;align-items:center;margin-bottom:6px;}
  .ing-row select{flex:2;}
  .ing-row input{flex:1;}
  .muted{color:var(--ink-soft);font-family:'Helvetica Neue',sans-serif;font-size:12px;}
  .tag-principal{color:var(--green);font-weight:600;}
  .tag-venda{color:var(--gold);font-weight:600;font-family:'Helvetica Neue',sans-serif;}
  .save-indicator{position:fixed;bottom:14px;right:20px;font-family:'Helvetica Neue',sans-serif;font-size:11px;color:var(--ink-soft);opacity:0;transition:opacity .3s;}
  .save-indicator.show{opacity:1;}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const {useState, useEffect, useRef, useMemo} = React;

const STORAGE_KEY = 'padaria-db-v1';
const uid = () => Math.random().toString(36).slice(2,10);
const money = (v) => (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const today = () => new Date().toISOString().slice(0,10);
const nowStr = () => new Date().toLocaleString('pt-BR');

// ---------- CONFIGURAÇÃO DO SUPABASE ----------
// Preencha aqui com os dados do SEU projeto (Project Settings > API no painel do Supabase),
// ou deixe em branco — na primeira vez que abrir, o sistema pede pra você colar essas informações
// e guarda no localStorage do navegador (não precisa editar o arquivo pra isso).
const SUPABASE_URL_DEFAULT = 'https://woqiboklzhemyysdfklk.supabase.co';
const SUPABASE_ANON_KEY_DEFAULT = 'sb_publishable_fAg5rsdzgDKqFpPl7WlOaQ_W4WjEkS5';

function getSupabaseConfig(){
  return {
    url: localStorage.getItem('padaria_supabase_url') || SUPABASE_URL_DEFAULT,
    key: localStorage.getItem('padaria_supabase_key') || SUPABASE_ANON_KEY_DEFAULT,
  };
}
function saveSupabaseConfig(url, key){
  localStorage.setItem('padaria_supabase_url', url);
  localStorage.setItem('padaria_supabase_key', key);
}
let supabaseClient = null;
function getSupabaseClient(){
  const {url, key} = getSupabaseConfig();
  if(!url || !key) return null;
  if(!supabaseClient){ supabaseClient = window.supabase.createClient(url, key); }
  return supabaseClient;
}

const emptyDB = () => ({
  products: [],       // {id, code, name, category, unit, supplier, costPrice, salePrice, minStock, status}
  stockPrincipal: {}, // productId -> qty
  stockProducao: {},  // productId -> qty (insumos separados/reservados para produção, deduzidos ao produzir)
  stockVenda: {},     // productId -> qty
  purchases: [],
  transfers: [],
  recipes: [],        // {id, name, outputProductId, yieldQty, ingredients:[{productId, qty}]}
  productionOrders: [],
  adjustments: [],    // {id, location, productId, qty, reason, note, date, time}
  orders: [],          // {id, clientId, clientSnapshot, date, items:[{productId,name,unit,qty,unitPrice,total}], total}
  clients: [],         // {id, type, name, document, phone, email, street, number, neighborhood, city, state, zip}
  company: {name:'', document:'', phone:'', email:'', street:'', number:'', neighborhood:'', city:'', state:'', zip:''},
  pricingConfig: {lossPct:3, laborPct:15, energyPct:5, taxPct:8, packagingValue:0.5, marginPct:60, minMarginPct:10},
  pricingItems: [],    // {id, productId, useDefaults, notForSale, lossPct, laborPct, energyPct, taxPct, packagingValue, marginPct}
});

function useDB(userId){
  const [db, setDB] = useState(null);
  const [saving, setSaving] = useState(false);
  const [loadError, setLoadError] = useState('');
  const [saveError, setSaveError] = useState('');
  const saveTimer = useRef(null);
  const dbRef = useRef(null);
  const lastLocalEditRef = useRef(0);
  const savingRef = useRef(false);

  useEffect(() => { dbRef.current = db; }, [db]);

  const fetchFromServer = async () => {
    const sb = getSupabaseClient();
    const {data, error} = await sb.from('app_state').select('data').eq('user_id', userId).maybeSingle();
    if(error) throw error;
    return (data && data.data) ? data.data : null;
  };

  useEffect(() => {
    if(!userId){ setDB(null); return; }
    setLoadError('');
    (async () => {
      try{
        const remote = await fetchFromServer();
        if(remote){
          setDB({...emptyDB(), ...remote});
        } else {
          const sb = getSupabaseClient();
          const fresh = emptyDB();
          const {error: insertError} = await sb.from('app_state').insert({user_id: userId, data: fresh});
          if(insertError) throw insertError;
          setDB(fresh);
        }
      }catch(e){
        console.error(e);
        setLoadError('Não foi possível carregar os dados do Supabase: '+e.message);
      }
    })();
  }, [userId]);

  // Atualização automática: busca dados novos no servidor de tempos em tempos
  // (assim pedidos feitos por clientes em outro dispositivo aparecem sozinhos).
  // Só aplica se não houver edição local recente nem salvamento em andamento,
  // pra não sobrescrever algo que o admin acabou de digitar.
  useEffect(() => {
    if(!userId) return;
    const id = setInterval(async () => {
      if(savingRef.current) return;
      if(Date.now() - lastLocalEditRef.current < 4000) return;
      try{
        const remote = await fetchFromServer();
        if(remote){
          const merged = {...emptyDB(), ...remote};
          if(JSON.stringify(merged) !== JSON.stringify(dbRef.current)){
            setDB(merged);
          }
        }
      }catch(e){ console.error('erro ao atualizar automaticamente', e); }
    }, 8000);
    return () => clearInterval(id);
  }, [userId]);

  useEffect(() => {
    if(db === null || !userId) return;
    setSaving(true);
    savingRef.current = true;
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      try{
        const sb = getSupabaseClient();
        const {data: updated, error} = await sb.from('app_state').update({data: db}).eq('user_id', userId).select('user_id');
        if(error) throw error;
        if(!updated || updated.length === 0){
          throw new Error('Nenhuma linha foi atualizada (o registro deste usuário pode não existir na tabela app_state — provável problema de permissão/RLS).');
        }
        setSaveError('');
      }catch(e){
        console.error('erro ao salvar', e);
        setSaveError('Falha ao salvar no Supabase: '+e.message);
      }
      setSaving(false);
      savingRef.current = false;
    }, 600);
  }, [db, userId]);

  const setDBTracked = (updater) => { lastLocalEditRef.current = Date.now(); setDB(updater); };

  const reloadNow = async () => {
    if(!userId) return;
    try{
      const remote = await fetchFromServer();
      if(remote) setDB({...emptyDB(), ...remote});
    }catch(e){ console.error('erro ao atualizar', e); }
  };

  return [db, setDBTracked, saving, loadError, saveError, reloadNow];
}

function Modal({title, onClose, children, wide}){
  return (
    <div className="modal-bg" onClick={(e)=>{if(e.target===e.currentTarget) onClose();}}>
      <div className="modal" style={wide?{width:600}:{}}>
        <h3>{title}</h3>
        {children}
      </div>
    </div>
  );
}

function Field({label, children}){
  return <div className="field"><label>{label}</label>{children}</div>;
}

// Botão de remover com confirmação em 2 cliques (window.confirm não funciona dentro do artifact)
function ConfirmButton({onConfirm, label, confirmLabel}){
  const [armed, setArmed] = useState(false);
  const timer = useRef(null);
  const click = () => {
    if(armed){
      clearTimeout(timer.current);
      setArmed(false);
      onConfirm();
    } else {
      setArmed(true);
      timer.current = setTimeout(()=>setArmed(false), 3000);
    }
  };
  return (
    <button type="button" className={"btn small "+(armed?'gold':'danger')} onClick={click}>
      {armed ? (confirmLabel||'Confirmar?') : (label||'Remover')}
    </button>
  );
}

// Gráfico de barras simples e interativo (hover destaca a barra)
function BarChart({data, color, valueFormatter}){
  const [hover, setHover] = useState(null);
  const fmt = valueFormatter || (v=>v);
  const barColor = color || 'var(--green)';
  const max = Math.max(1, ...data.map(d=>d.value));
  if(data.length===0) return <div className="empty">Sem dados para exibir.</div>;
  return (
    <div>
      {data.map((d,i)=>(
        <div key={i} style={{marginBottom:12, cursor:'default'}} onMouseEnter={()=>setHover(i)} onMouseLeave={()=>setHover(null)}>
          <div style={{display:'flex', justifyContent:'space-between', fontFamily:"'Helvetica Neue',sans-serif", fontSize:12.5, marginBottom:4}}>
            <span style={{fontWeight: hover===i?700:500, color: hover===i?'var(--green-deep)':'var(--ink)'}}>{d.label}</span>
            <span style={{color: hover===i?'var(--gold)':'var(--ink-soft)', fontWeight: hover===i?700:400}}>{fmt(d.value)}</span>
          </div>
          <div style={{background:'var(--line)', borderRadius:6, height:11, overflow:'hidden'}}>
            <div style={{width:(d.value/max*100)+'%', height:'100%', background: hover===i?'var(--gold)':barColor, transition:'width .5s ease, background .2s'}}/>
          </div>
        </div>
      ))}
    </div>
  );
}

// ---------- PERÍODO (compartilhado entre Painel e Relatórios) ----------
const pad2 = (n) => String(n).padStart(2,'0');
const dateToStr = (d) => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;

function getPeriodRange(period){
  const now = new Date();
  if(period.type==='personalizado'){
    const start = period.start || dateToStr(now);
    const end = period.end || dateToStr(now);
    return {start, end};
  }
  if(period.type==='dia'){
    const s = period.day || dateToStr(now);
    return {start:s, end:s};
  }
  if(period.type==='semana'){
    const base = period.day ? new Date(period.day+'T00:00:00') : now;
    const day = base.getDay();
    const diffToMonday = day===0 ? -6 : 1-day;
    const monday = new Date(base); monday.setDate(base.getDate()+diffToMonday);
    const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
    return {start: dateToStr(monday), end: dateToStr(sunday)};
  }
  if(period.type==='ano'){
    const y = period.year || now.getFullYear();
    return {start: `${y}-01-01`, end: `${y}-12-31`};
  }
  // 'mes'
  const [y,m] = period.month ? period.month.split('-').map(Number) : [now.getFullYear(), now.getMonth()+1];
  const first = new Date(y, m-1, 1);
  const last = new Date(y, m, 0);
  return {start: dateToStr(first), end: dateToStr(last)};
}
const inPeriod = (dateStr, range) => !!dateStr && dateStr>=range.start && dateStr<=range.end;

function PeriodSelector({period, setPeriod}){
  const now = new Date();
  const types = [['dia','Dia'],['semana','Semana'],['mes','Mês'],['ano','Ano'],['personalizado','Personalizado']];
  const inputStyle = {padding:'7px 9px', border:'1px solid var(--line)', borderRadius:6, fontFamily:"'Helvetica Neue',sans-serif", fontSize:13, background:'var(--cream)'};
  return (
    <div className="card" style={{marginBottom:14}}>
      <div style={{display:'flex', gap:6, flexWrap:'wrap', alignItems:'center'}}>
        {types.map(([key,label])=>(
          <button type="button" key={key} className={"btn small "+(period.type===key?'gold':'outline')} onClick={()=>setPeriod({...period, type:key})}>{label}</button>
        ))}

        {period.type==='dia' && <input type="date" value={period.day||dateToStr(now)} onChange={e=>setPeriod({...period, day:e.target.value})} style={inputStyle}/>}

        {period.type==='semana' && <>
          <span className="muted">escolha um dia dessa semana:</span>
          <input type="date" value={period.day||dateToStr(now)} onChange={e=>setPeriod({...period, day:e.target.value})} style={inputStyle}/>
        </>}

        {period.type==='mes' && <input type="month" value={period.month||`${now.getFullYear()}-${pad2(now.getMonth()+1)}`} onChange={e=>setPeriod({...period, month:e.target.value})} style={inputStyle}/>}

        {period.type==='ano' && <input type="number" value={period.year||now.getFullYear()} onChange={e=>setPeriod({...period, year:parseInt(e.target.value)||now.getFullYear()})} style={{...inputStyle, width:90}}/>}

        {period.type==='personalizado' && <>
          <input type="date" value={period.start||''} onChange={e=>setPeriod({...period, start:e.target.value})} style={inputStyle}/>
          <span className="muted">até</span>
          <input type="date" value={period.end||''} onChange={e=>setPeriod({...period, end:e.target.value})} style={inputStyle}/>
        </>}
      </div>
    </div>
  );
}


// ---------- DASHBOARD ----------
function Dashboard({db}){
  const [period, setPeriod] = useState({type:'mes'});
  const range = getPeriodRange(period);

  const stats = useMemo(() => {
    let stockPrincipalCost=0, stockProducaoCost=0, stockVendaCost=0, stockVendaSale=0;
    const skuPrincipal = [], skuProducao = [], skuVenda = [];
    db.products.forEach(p => {
      const qp = db.stockPrincipal[p.id]||0;
      const qprod = db.stockProducao[p.id]||0;
      const qv = db.stockVenda[p.id]||0;
      if(qp>0) skuPrincipal.push(p);
      if(qprod>0) skuProducao.push(p);
      if(qv>0) skuVenda.push(p);
      stockPrincipalCost += qp*p.costPrice;
      stockProducaoCost += qprod*p.costPrice;
      stockVendaCost += qv*p.costPrice; stockVendaSale += qv*p.salePrice;
    });
    const prodCount = db.productionOrders.filter(o=>inPeriod(o.date, range)).length;
    const lowStock = db.products.filter(p => ((db.stockPrincipal[p.id]||0)+(db.stockProducao[p.id]||0)+(db.stockVenda[p.id]||0)) < (p.minStock||0));
    const adjustmentsPeriod = db.adjustments.filter(a=>inPeriod(a.date, range));

    const lossMap = {};
    adjustmentsPeriod.forEach(a => {
      const p = db.products.find(x=>x.id===a.productId);
      const value = p ? a.qty*p.costPrice : 0;
      if(!lossMap[a.productId]) lossMap[a.productId] = {name: p?p.name:'—', unit: p?p.unit:'', qty:0, value:0};
      lossMap[a.productId].qty += a.qty;
      lossMap[a.productId].value += value;
    });
    const lossByProduct = Object.values(lossMap).sort((a,b)=>b.value-a.value);
    const lossCostPeriod = lossByProduct.reduce((a,l)=>a+l.value,0);

    const ordersPeriod = db.orders.filter(o=>inPeriod(o.date, range));
    const orderMap = {};
    ordersPeriod.forEach(o => {
      o.items.forEach(it => {
        if(!orderMap[it.productId]) orderMap[it.productId] = {name: it.name, unit: it.unit, qty:0, value:0};
        orderMap[it.productId].qty += it.qty;
        orderMap[it.productId].value += it.total;
      });
    });
    const encomendasByProduct = Object.values(orderMap).sort((a,b)=>b.value-a.value);
    const encomendasTotalPeriod = ordersPeriod.reduce((a,o)=>a+o.total,0);

    return {stockPrincipalCost, stockProducaoCost, stockVendaCost, stockVendaSale,
      skuPrincipalCount: skuPrincipal.length, skuProducaoCount: skuProducao.length, skuVendaCount: skuVenda.length,
      prodCount, lowStock, adjustmentsPeriodCount: adjustmentsPeriod.length, lossCostPeriod, lossByProduct,
      ordersPeriodCount: ordersPeriod.length, encomendasByProduct, encomendasTotalPeriod};
  }, [db, range.start, range.end]);

  return (
    <div>
      <h1 className="page-title">Painel Geral</h1>
      <div className="page-sub">Visão consolidada do estoque e da produção — atualizado em tempo real.</div>

      <PeriodSelector period={period} setPeriod={setPeriod}/>

      <div className="grid-4">
        <div className="stat"><div className="label">Estoque Principal</div><div className="value">{stats.skuPrincipalCount} produto(s)</div><div className="muted">{money(stats.stockPrincipalCost)} investido</div></div>
        <div className="stat"><div className="label">Estoque de Produção</div><div className="value">{stats.skuProducaoCount} produto(s)</div><div className="muted">{money(stats.stockProducaoCost)} em custo</div></div>
        <div className="stat"><div className="label">Área de Venda</div><div className="value gold">{stats.skuVendaCount} produto(s)</div><div className="muted">{money(stats.stockVendaSale)} potencial</div></div>

function Produtos({db, setDB}){
  const [modal, setModal] = useState(null);
  const blank = {code:'', barcode:'', name:'', category:'', type:'Insumo', unit:'un', supplier:'',
    packageLabel:'', packageQty:'', packagePrice:'', costPrice:'', salePrice:'', minStock:'', status:'Ativo'};
  const [form, setForm] = useState(blank);
  const [error, setError] = useState('');
  const [exportModal, setExportModal] = useState(false);

  const openNew = () => { setForm(blank); setError(''); setModal('new'); };
  const openEdit = (p) => { setForm({...blank, ...p}); setError(''); setModal(p.id); };

  // se a embalagem de compra estiver preenchida, o custo por unidade de estoque é calculado automaticamente
  const packageQtyNum = parseFloat(form.packageQty)||0;
  const packagePriceNum = parseFloat(form.packagePrice)||0;
  const calculatedCost = packageQtyNum>0 ? packagePriceNum/packageQtyNum : null;

  const save = () => {
    if(!form.name) return;
    setError('');

    const code = (form.code||'').trim();
    const barcode = (form.barcode||'').trim();
    if(code){
      const dup = db.products.find(p => p.id!==form.id && (p.code||'').trim()===code);
      if(dup){ setError(`Já existe o produto "${dup.name}" cadastrado com o código "${code}".`); return; }
    }
    if(barcode){
      const dup = db.products.find(p => p.id!==form.id && (p.barcode||'').trim()===barcode);
      if(dup){ setError(`Já existe o produto "${dup.name}" cadastrado com o código de barras "${barcode}".`); return; }
    }

    const costPrice = calculatedCost!==null ? calculatedCost : (parseFloat(form.costPrice)||0);
    const clean = {...form, code, barcode, costPrice, salePrice:parseFloat(form.salePrice)||0, minStock:parseFloat(form.minStock)||0,
      packageQty: packageQtyNum, packagePrice: packagePriceNum};
    setDB(d => {
      const exists = d.products.find(p=>p.id===form.id);
      let products;
      if(exists){ products = d.products.map(p=>p.id===form.id?clean:p); }
      else { const withId = {...clean, id: uid()}; products = [...d.products, withId]; }
      return {...d, products};
    });
    setModal(null);
  };

  const remove = (id) => {
    setDB(d => ({...d, products: d.products.filter(p=>p.id!==id)}));
  };

  return (
    <div>
      <h1 className="page-title">Cadastro de Produtos</h1>
      <div className="page-sub">Insumos (usados em receitas) e produtos de revenda (comprados prontos, como refrigerante) — base para estoque e produção.</div>
      <div className="toolbar"><div/><div style={{display:'flex', gap:8}}>
        <button type="button" className="btn outline" onClick={()=>setExportModal(true)}>📤 Exportar</button>
        <button type="button" className="btn" onClick={openNew}>+ Novo produto</button>
      </div></div>
      <div className="card">
        {db.products.length===0 ? <div className="empty">Nenhum produto cadastrado ainda.</div> :
        <table><thead><tr><th>Nome</th><th>Tipo</th><th>Un. estoque</th><th>Embalagem de compra</th><th>Custo/un.</th><th>Venda</th><th>Estoque total</th><th></th></tr></thead>
        <tbody>{db.products.map(p=>{
          const total = (db.stockPrincipal[p.id]||0)+(db.stockProducao[p.id]||0)+(db.stockVenda[p.id]||0);
          return (
          <tr key={p.id}>
            <td>{p.name}</td>
            <td><span className={"badge "+(p.type==='Revenda'?'ok':'low')} style={p.type==='Revenda'?{background:'rgba(201,162,39,.16)',color:'#8a6d10'}:{}}>{p.type||'Insumo'}</span></td>
            <td>{p.unit}</td>
            <td className="muted">{p.packageQty>0 ? `${p.packageLabel||'embalagem'} (${p.packageQty} ${p.unit} · ${money(p.packagePrice)})` : '—'}</td>
            <td>{money(p.costPrice)}</td><td>{p.type==='Revenda'?money(p.salePrice):<span className="muted">—</span>}</td>
            <td>{total} {total < p.minStock ? <span className="badge low">baixo</span> : <span className="badge ok">ok</span>}</td>
            <td><button type="button" className="btn small outline" onClick={()=>openEdit(p)}>Editar</button> <ConfirmButton onConfirm={()=>remove(p.id)}/></td>
          </tr>);
        })}</tbody></table>}
      </div>

      {modal && <Modal title={modal==='new'?'Novo produto':'Editar produto'} onClose={()=>setModal(null)} wide>
        <div className="row2">
          <Field label="Nome"><input value={form.name} onChange={e=>setForm({...form,name:e.target.value})}/></Field>
          <Field label="Tipo"><select value={form.type} onChange={e=>setForm({...form,type:e.target.value})}>
            <option value="Insumo">Insumo (usado em receitas — ex: farinha, açúcar, ovo)</option>
            <option value="Revenda">Revenda (comprado pronto — ex: refrigerante)</option>
          </select></Field>
        </div>
        <div className="row2">
          <Field label="Código"><input value={form.code} onChange={e=>setForm({...form,code:e.target.value})}/></Field>
          <Field label="Código de barras"><input value={form.barcode} onChange={e=>setForm({...form,barcode:e.target.value})}/></Field>
        </div>
        <div className="row2">
          <Field label="Categoria"><input value={form.category} onChange={e=>setForm({...form,category:e.target.value})}/></Field>
          <Field label="Unidade de estoque"><select value={form.unit} onChange={e=>setForm({...form,unit:e.target.value})}>
            <option>un</option><option>kg</option><option>g</option><option>l</option><option>ml</option>
          </select></Field>
        </div>
        <Field label="Fornecedor"><input value={form.supplier} onChange={e=>setForm({...form,supplier:e.target.value})}/></Field>

        <div className="card" style={{background:'var(--cream)', margin:'10px 0'}}>
          <h2 style={{fontSize:13}}>Embalagem de compra (opcional)</h2>
          <div className="muted" style={{marginBottom:8}}>Ex: farinha vem em saco de 25kg por R$ 90; Coca-Cola vem em pack de 12 unidades por R$ 30. Preencha aqui e o custo por {form.unit} é calculado sozinho.</div>
          <div className="row2">
            <Field label="Descrição da embalagem"><input placeholder="Saco 25kg / Pack 12un" value={form.packageLabel} onChange={e=>setForm({...form,packageLabel:e.target.value})}/></Field>
            <Field label={`Quantidade por embalagem (em ${form.unit})`}><input type="number" value={form.packageQty} onChange={e=>setForm({...form,packageQty:e.target.value})}/></Field>
          </div>
          <Field label="Preço da embalagem (R$)"><input type="number" step="0.01" value={form.packagePrice} onChange={e=>setForm({...form,packagePrice:e.target.value})}/></Field>
        </div>

        <div className="row2">
          <Field label={`Custo por ${form.unit} (R$)`}>
            <input type="number" step="0.01" disabled={calculatedCost!==null}
              value={calculatedCost!==null ? calculatedCost.toFixed(4) : form.costPrice}
              onChange={e=>setForm({...form,costPrice:e.target.value})}/>
          </Field>
          {form.type==='Revenda' && <Field label="Preço de venda (R$)"><input type="number" step="0.01" value={form.salePrice} onChange={e=>setForm({...form,salePrice:e.target.value})}/></Field>}
        </div>
        <Field label="Estoque mínimo"><input type="number" value={form.minStock} onChange={e=>setForm({...form,minStock:e.target.value})}/></Field>
        {error && <div className="muted" style={{color:'var(--red)', marginBottom:8}}>{error}</div>}
        <div className="modal-actions">
          <button type="button" className="btn outline" onClick={()=>setModal(null)}>Cancelar</button>
          <button type="button" className="btn" onClick={save}>Salvar</button>
        </div>
      </Modal>}
      {exportModal && <ExportProductsModal db={db} onClose={()=>setExportModal(false)}/>}
    </div>
  );
}

// Gera uma URL de download a partir de um Blob (mais confiável que data: URI para o atributo download)
const makeBlobUrl = (content, mime) => URL.createObjectURL(new Blob(['\ufeff'+content], {type: mime}));
const csvFromRows = (header, rows) => [header, ...rows].map(r => r.map(v => `"${(v??'').toString().replace(/"/g,'""')}"`).join(';')).join('\r\n');

function ExportProductsModal({db, onClose}){
  const [typeFilter, setTypeFilter] = useState('Todos');
  const [selected, setSelected] = useState(() => {
    const s = {}; db.products.forEach(p=>{ s[p.id]=true; }); return s;
  });
  const [pdfPreview, setPdfPreview] = useState(null);
  const [csvUri, setCsvUri] = useState(null);

  const filtered = db.products.filter(p => typeFilter==='Todos' || (p.type||'Insumo')===typeFilter);
  const toggle = (id) => setSelected(s=>({...s,[id]:!s[id]}));
  const toggleAll = (val) => setSelected(prev => { const s={...prev}; filtered.forEach(p=>{ s[p.id]=val; }); return s; });
  const chosen = filtered.filter(p=>selected[p.id]);

  const exportPdf = () => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFillColor(30,55,33); doc.rect(0,0,210,22,'F');
    doc.setTextColor(255,255,255); doc.setFontSize(15); doc.text('Produtos Cadastrados', 14, 14);
    doc.setTextColor(30,30,30);
    const rows = chosen.map(p=>[p.code||'—', p.name, p.type||'Insumo', p.unit, money(p.costPrice), p.type==='Revenda'?money(p.salePrice):'—']);
    doc.autoTable({ startY:30, head:[['Código','Nome','Tipo','Unidade','Custo','Preço de Venda']], body: rows, headStyles:{fillColor:[47,82,51]}, styles:{fontSize:9} });
    setPdfPreview({dataUri: doc.output('datauristring'), filename:'produtos.pdf'});
    setCsvUri(null);
  };

  const exportCsv = () => {
    const header = ['Codigo','Codigo de Barras','Nome','Categoria','Tipo','Unidade','Fornecedor','Custo','Preco de Venda','Estoque Minimo'];
    const rows = chosen.map(p=>[p.code,p.barcode,p.name,p.category,p.type,p.unit,p.supplier,p.costPrice,p.salePrice,p.minStock]);
    setCsvUri(makeBlobUrl(csvFromRows(header, rows), 'text/csv;charset=utf-8'));
    setPdfPreview(null);
  };

  return (
    <Modal title="Exportar produtos cadastrados" wide onClose={onClose}>
      <div className="row2">
        <Field label="Filtrar por tipo"><select value={typeFilter} onChange={e=>setTypeFilter(e.target.value)}>
          <option>Todos</option><option>Insumo</option><option>Revenda</option>
        </select></Field>
        <div style={{display:'flex', alignItems:'flex-end', gap:8, paddingBottom:9}}>
          <button type="button" className="btn small outline" onClick={()=>toggleAll(true)}>Marcar todos</button>
          <button type="button" className="btn small outline" onClick={()=>toggleAll(false)}>Desmarcar todos</button>
        </div>
      </div>
      <div style={{maxHeight:300, overflow:'auto', border:'1px solid var(--line)', borderRadius:8, marginBottom:12}}>
        {filtered.length===0 ? <div className="empty">Nenhum produto neste filtro.</div> :
        filtered.map(p=>(
          <label key={p.id} style={{display:'flex', alignItems:'center', gap:10, padding:'8px 12px', borderBottom:'1px solid var(--line)', cursor:'pointer'}}>
            <input type="checkbox" checked={!!selected[p.id]} onChange={()=>toggle(p.id)}/>
            <span style={{flex:1}}>{p.name}</span>
            <span className="muted">{p.type||'Insumo'} · {p.unit}</span>
          </label>
        ))}
      </div>
      <div className="muted" style={{marginBottom:10}}>{chosen.length} produto(s) selecionado(s) para exportar.</div>
      <div style={{display:'flex', gap:8, flexWrap:'wrap'}}>
        <button type="button" className="btn" onClick={exportPdf} disabled={chosen.length===0}>📄 Gerar PDF</button>
        <button type="button" className="btn outline" onClick={exportCsv} disabled={chosen.length===0}>📊 Gerar CSV (Excel)</button>
        {csvUri && <a className="btn gold" href={csvUri} download="produtos.csv">Baixar CSV</a>}
      </div>
      <div className="modal-actions">
        <button type="button" className="btn outline" onClick={onClose}>Fechar</button>
      </div>
      {pdfPreview && <PdfPreviewModal dataUri={pdfPreview.dataUri} filename={pdfPreview.filename} onClose={()=>setPdfPreview(null)}/>}
    </Modal>
  );
}

// Lê um arquivo (imagem ou PDF) e, se for imagem, redimensiona para caber no limite de armazenamento
const readAttachment = (file, maxDim=1400, quality=0.72) => new Promise((resolve, reject) => {
  const reader = new FileReader();
  reader.onload = (e) => {
    if(file.type === 'application/pdf'){
      resolve({dataUrl: e.target.result, type:'application/pdf', name: file.name});
      return;
    }
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if(w>maxDim || h>maxDim){ const scale = maxDim/Math.max(w,h); w*=scale; h*=scale; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve({dataUrl: canvas.toDataURL('image/jpeg', quality), type:'image/jpeg', name: file.name});
    };
    img.onerror = reject;
    img.src = e.target.result;
  };
  reader.onerror = reject;
  reader.readAsDataURL(file);
});

const normalizeText = (s) => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
const matchProduct = (name, products) => {
  const n = normalizeText(name);
  if(!n) return null;
  const exact = products.find(p=>normalizeText(p.name)===n);
  if(exact) return exact;
  const partial = products.find(p=>normalizeText(p.name).includes(n) || n.includes(normalizeText(p.name)));
  return partial || null;
};
const VALID_UNITS = ['kg','g','l','ml','un'];

async function extractInvoiceItems(fileData){
  const isPdf = fileData.type === 'application/pdf';
  const base64 = fileData.dataUrl.split(',')[1];
  const contentBlock = isPdf
    ? { type:'document', source:{ type:'base64', media_type:'application/pdf', data: base64 } }
    : { type:'image', source:{ type:'base64', media_type: fileData.type, data: base64 } };
  const prompt = `Esta imagem/documento é uma nota fiscal ou cupom fiscal de compra de insumos/produtos para uma padaria.
Extraia os itens comprados. Responda APENAS com um JSON válido, sem markdown e sem texto antes ou depois, no formato exato:
{"supplier":"nome do fornecedor ou vazio","invoiceNumber":"numero da nota ou vazio","date":"AAAA-MM-DD ou vazio","items":[{"name":"nome do produto","quantity":0,"unit":"kg|g|l|ml|un","unitPrice":0}]}
Use "kg" ou "g" para peso, "l" ou "ml" para líquidos, e "un" para itens contados em unidades (ex: pacotes, latas, garrafas). Se não conseguir ler algum campo, use "" ou 0. unitPrice é o valor pago por unidade de medida (ex: preço por kg, preço por litro, ou preço por unidade).`;

  let response;
  try{
    response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 3000,
        messages: [{ role: "user", content: [contentBlock, {type:"text", text: prompt}] }]
      })
    });
  }catch(networkErr){
    throw new Error('Falha de rede ao chamar a IA: '+networkErr.message);
  }

  if(!response.ok){
    let bodyText = '';
    try{ bodyText = await response.text(); }catch(e){}
    throw new Error('A IA respondeu com erro '+response.status+': '+bodyText.slice(0,300));
  }

  const data = await response.json();
  const text = (data.content||[]).map(b=>b.text||'').join('\n');
  if(!text.trim()) throw new Error('A IA não retornou nenhum texto (resposta vazia).');
  const clean = text.replace(/```json|```/g,'').trim();
  const jsonMatch = clean.match(/\{[\s\S]*\}/);
  const toParse = jsonMatch ? jsonMatch[0] : clean;
  try{
    return JSON.parse(toParse);
  }catch(parseErr){
    throw new Error('Não consegui interpretar a resposta da IA: '+parseErr.message+' — trecho: '+toParse.slice(0,200));
  }
}

function ImportarNota({db, setDB, onClose}){
  const [file, setFile] = useState(null);       // {dataUrl, type, name}
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [invoiceMeta, setInvoiceMeta] = useState(null); // {supplier, invoiceNumber, date}
  const [items, setItems] = useState(null); // array em revisão

  const onFileChange = async (e) => {
    const f = e.target.files[0];
    if(!f) return;
    setError(''); setItems(null);
    try{
      const result = await readAttachment(f);
      if(result.dataUrl.length > 4500000){ setError('Arquivo muito grande, tente uma foto com menos resolução.'); return; }
      setFile(result);
    }catch(err){ setError('Não foi possível ler o arquivo.'); }
  };

  const readNota = async () => {
    if(!file) return;
    setLoading(true); setError('');
    try{
      const extracted = await extractInvoiceItems(file);
      setInvoiceMeta({supplier: extracted.supplier||'', invoiceNumber: extracted.invoiceNumber||'', date: extracted.date || today()});
      setItems((extracted.items||[]).map(it => {
        const unit = VALID_UNITS.includes(it.unit) ? it.unit : 'un';
        const match = matchProduct(it.name, db.products);
        return {
          tempId: uid(), name: it.name||'', quantity: it.quantity||0, unit, unitPrice: it.unitPrice||0,
          productChoice: match ? match.id : '__new__'
        };
      }));
    }catch(err){
      setError('Não foi possível ler a nota automaticamente. Detalhe: '+err.message);
    }
    setLoading(false);
  };

  const setItem = (i, field, val) => setItems(items.map((it,idx)=> idx===i ? {...it, [field]:val} : it));
  const removeItem = (i) => setItems(items.filter((_,idx)=>idx!==i));

  const confirmImport = async () => {
    if(!items || items.length===0) return;
    let products = [...db.products];
    let stockPrincipal = {...db.stockPrincipal};
    let purchases = [...db.purchases];

    for(const it of items){
      const qty = parseFloat(it.quantity)||0;
      const unitPrice = parseFloat(it.unitPrice)||0;
      if(qty<=0) continue;
      let productId = it.productChoice;
      if(productId === '__new__'){
        productId = uid();
        products.push({id: productId, code:'', barcode:'', name: it.name||'Produto sem nome', category:'', type:'Insumo',
          unit: it.unit, supplier:'', packageLabel:'', packageQty:0, packagePrice:0,
          costPrice: unitPrice, salePrice:0, minStock:0, status:'Ativo'});
      }
      const purchaseId = uid();
      if(file){
        try{ await window.storage.set('attachment:'+purchaseId, JSON.stringify(file), false); }catch(e){}
      }
      purchases.push({id: purchaseId, productId, supplier: invoiceMeta.supplier, invoice: invoiceMeta.invoiceNumber,
        date: invoiceMeta.date||today(), qty, unitPrice, total: qty*unitPrice, attachment: file ? {name:file.name, type:file.type} : null});
      stockPrincipal[productId] = (stockPrincipal[productId]||0)+qty;
    }

    setDB(d => ({...d, products, purchases, stockPrincipal}));
    onClose();
  };

  return (
    <Modal title="Importar nota fiscal com IA" wide onClose={onClose}>
      <div className="muted" style={{marginBottom:10}}>Envie a foto da nota fiscal ou cupom fiscal. A IA lê os itens automaticamente e você confere antes de lançar no estoque — produtos ainda não cadastrados são criados sozinhos. Precisa de conexão com a internet.</div>

      <Field label="Foto ou PDF da nota"><input type="file" accept="image/*,application/pdf" onChange={onFileChange}/></Field>
      {file && file.type!=='application/pdf' && <img src={file.dataUrl} alt="Nota" style={{maxWidth:180, borderRadius:8, border:'1px solid var(--line)', marginBottom:10}}/>}
      {file && file.type==='application/pdf' && <div className="muted" style={{marginBottom:10}}>PDF selecionado: {file.name}</div>}

      {file && !items && <button type="button" className="btn gold" onClick={readNota} disabled={loading}>{loading ? 'Lendo nota...' : '🧾 Ler nota com IA'}</button>}
      {error && <div className="muted" style={{color:'var(--red)', margin:'8px 0'}}>{error}
        <div style={{marginTop:4}}>Se o erro persistir, você pode cadastrar essa compra manualmente em "Nova compra manual".</div>
      </div>}

      {items && (
        <div style={{marginTop:14}}>
          <div className="row2">
            <Field label="Fornecedor"><input value={invoiceMeta.supplier} onChange={e=>setInvoiceMeta({...invoiceMeta, supplier:e.target.value})}/></Field>
            <Field label="Nota fiscal"><input value={invoiceMeta.invoiceNumber} onChange={e=>setInvoiceMeta({...invoiceMeta, invoiceNumber:e.target.value})}/></Field>
          </div>
          <Field label="Data"><input type="date" value={invoiceMeta.date} onChange={e=>setInvoiceMeta({...invoiceMeta, date:e.target.value})}/></Field>

          <label className="field" style={{fontFamily:"'Helvetica Neue',sans-serif", fontSize:11, color:'var(--ink-soft)', textTransform:'uppercase'}}>Itens identificados — confira antes de importar</label>
          {items.map((it,i)=>(
            <div key={it.tempId} className="card" style={{background:'var(--cream)', marginBottom:8, padding:'10px 12px'}}>
              <div className="row2">
                <Field label="Produto"><select value={it.productChoice} onChange={e=>setItem(i,'productChoice',e.target.value)}>
                  <option value="__new__">+ Criar novo produto: "{it.name}"</option>
                  {db.products.map(p=><option key={p.id} value={p.id}>{p.name} ({p.unit})</option>)}
                </select></Field>
                {it.productChoice==='__new__' && <Field label="Nome do novo produto"><input value={it.name} onChange={e=>setItem(i,'name',e.target.value)}/></Field>}
              </div>
              <div className="row2">
                <Field label="Quantidade"><input type="number" value={it.quantity} onChange={e=>setItem(i,'quantity',e.target.value)}/></Field>
                <Field label="Unidade"><select value={it.unit} onChange={e=>setItem(i,'unit',e.target.value)}>
                  {VALID_UNITS.map(u=><option key={u} value={u}>{u}</option>)}
                </select></Field>
              </div>
              <div className="row2">
                <Field label="Valor por unidade (R$)"><input type="number" step="0.01" value={it.unitPrice} onChange={e=>setItem(i,'unitPrice',e.target.value)}/></Field>
                <div style={{display:'flex', alignItems:'flex-end', paddingBottom:9}}>
                  <span className="muted" style={{marginRight:10}}>Total: {money((parseFloat(it.quantity)||0)*(parseFloat(it.unitPrice)||0))}</span>
                  <button type="button" className="btn small danger" onClick={()=>removeItem(i)}>Remover item</button>
                </div>
              </div>
            </div>
          ))}
        </div>
      )}

      <div className="modal-actions">
        <button type="button" className="btn outline" onClick={onClose}>Cancelar</button>
        {items && <button type="button" className="btn" onClick={confirmImport}>Confirmar e lançar no estoque</button>}
      </div>
    </Modal>
  );
}

function Compras({db, setDB}){
  const [modal, setModal] = useState(false);
  const [importModal, setImportModal] = useState(false);
  const blank = {productId:'', supplier:'', invoice:'', packages:'', qty:'', unitPrice:'', date: today()};
  const [form, setForm] = useState(blank);
  const [pendingAttachment, setPendingAttachment] = useState(null); // {dataUrl, type, name}
  const [attachError, setAttachError] = useState('');
  const [viewing, setViewing] = useState(null); // {attKey, name}

  const selectedProduct = db.products.find(p=>p.id===form.productId);
  const hasPackage = selectedProduct && selectedProduct.packageQty>0;

  const effectiveQty = parseFloat(form.qty)||0;
  const effectiveUnitPrice = parseFloat(form.unitPrice)||0;
  const effectiveTotal = effectiveQty*effectiveUnitPrice;

  const onPackagesChange = (val) => {
    const n = parseFloat(val)||0;
    if(hasPackage && n>0){
      const qty = n*selectedProduct.packageQty;
      const unitPrice = selectedProduct.packagePrice/selectedProduct.packageQty;
      setForm({...form, packages: val, qty: String(qty), unitPrice: unitPrice.toFixed(4)});
    } else {
      setForm({...form, packages: val});
    }
  };

  const onFileChange = async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    setAttachError('');
    try{
      const result = await readAttachment(file);
      if(result.dataUrl.length > 4500000){ setAttachError('Arquivo muito grande, tente uma foto com menos resolução.'); return; }
      setPendingAttachment(result);
    }catch(err){ setAttachError('Não foi possível ler o arquivo.'); }
  };

  const save = async () => {
    if(!form.productId || effectiveQty<=0) return;
    const purchaseId = uid();
    let attachmentMeta = null;
    if(pendingAttachment){
      try{
        await window.storage.set('attachment:'+purchaseId, JSON.stringify(pendingAttachment), false);
        attachmentMeta = {name: pendingAttachment.name, type: pendingAttachment.type};
      }catch(err){ /* segue sem anexo se falhar */ }
    }
    setDB(d => ({
      ...d,
      purchases: [...d.purchases, {id:purchaseId, productId:form.productId, supplier:form.supplier, invoice:form.invoice,
        date:form.date, qty:effectiveQty, unitPrice:effectiveUnitPrice, total:effectiveTotal, attachment: attachmentMeta}],
      stockPrincipal: {...d.stockPrincipal, [form.productId]: (d.stockPrincipal[form.productId]||0)+effectiveQty}
    }));
    setForm(blank); setPendingAttachment(null); setAttachError(''); setModal(false);
  };

  const removePurchase = (c) => {
    if(c.attachment){ window.storage.delete('attachment:'+c.id, false).catch(()=>{}); }
    setDB(d => ({
      ...d,
      purchases: d.purchases.filter(x=>x.id!==c.id),
      stockPrincipal: {...d.stockPrincipal, [c.productId]: (d.stockPrincipal[c.productId]||0)-c.qty}
    }));
  };

  return (
    <div>
      <h1 className="page-title">Compras e Entradas</h1>
      <div className="page-sub">Registre entradas de insumos e produtos de revenda — atualiza o Estoque Principal automaticamente. Anexe a foto da nota fiscal ou cupom fiscal, se quiser.</div>
      <div className="toolbar"><div/><div style={{display:'flex', gap:8}}>
        <button type="button" className="btn gold" onClick={()=>setImportModal(true)}>🧾 Importar nota fiscal (IA)</button>
        <button type="button" className="btn" onClick={()=>setModal(true)}>+ Nova compra manual</button>
      </div></div>
      <div className="card">
        {db.purchases.length===0 ? <div className="empty">Nenhuma compra registrada.</div> :
        <table><thead><tr><th>Data</th><th>Produto</th><th>Fornecedor</th><th>NF</th><th>Qtd.</th><th>Vlr. unit.</th><th>Total</th><th>Anexo</th><th></th></tr></thead>
        <tbody>{[...db.purchases].reverse().map(c=>{
          const p = db.products.find(x=>x.id===c.productId);
          return <tr key={c.id}><td>{c.date}</td><td>{p?p.name:'—'}</td><td>{c.supplier}</td><td>{c.invoice}</td><td>{c.qty} {p?p.unit:''}</td><td>{money(c.unitPrice)}</td><td>{money(c.total)}</td>
            <td>{c.attachment ? <button type="button" className="btn small outline" onClick={()=>setViewing({attKey:'attachment:'+c.id, name:c.attachment.name})}>Ver</button> : <span className="muted">—</span>}</td>
            <td><ConfirmButton onConfirm={()=>removePurchase(c)}/></td></tr>;
        })}</tbody></table>}
      </div>
      {modal && <Modal title="Nova compra" onClose={()=>setModal(false)}>
        <Field label="Produto"><select value={form.productId} onChange={e=>setForm({...form,productId:e.target.value, packages:'', qty:'', unitPrice:''})}>
          <option value="">Selecione...</option>
          {db.products.map(p=><option key={p.id} value={p.id}>{p.name}{p.packageQty>0?` (${p.packageLabel||'embalagem'})`:''}</option>)}
        </select></Field>
        <div className="row2">
          <Field label="Fornecedor"><input value={form.supplier} onChange={e=>setForm({...form,supplier:e.target.value})}/></Field>
          <Field label="Nota fiscal"><input value={form.invoice} onChange={e=>setForm({...form,invoice:e.target.value})}/></Field>
        </div>

        {hasPackage && (
          <>
            <Field label={`Nº de embalagens (${selectedProduct.packageLabel||'embalagem'} — ${selectedProduct.packageQty} ${selectedProduct.unit} a ${money(selectedProduct.packagePrice)} cada) — opcional, preenche automático`}>
              <input type="number" value={form.packages} onChange={e=>onPackagesChange(e.target.value)}/>
            </Field>
            <div className="muted" style={{marginBottom:8}}>Preenchido automático a partir da embalagem — edite os campos abaixo se o valor pago desta vez for diferente.</div>
          </>
        )}
        <div className="row2">
          <Field label="Quantidade"><input type="number" value={form.qty} onChange={e=>setForm({...form,qty:e.target.value})}/></Field>
          <Field label="Valor unitário pago (R$)"><input type="number" step="0.01" value={form.unitPrice} onChange={e=>setForm({...form,unitPrice:e.target.value})}/></Field>
        </div>
        <div className="muted" style={{marginBottom:8}}>Total desta compra: {money(effectiveTotal)}</div>

        <Field label="Data"><input type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/></Field>

        <Field label="Foto da nota fiscal / cupom fiscal (opcional)">
          <input type="file" accept="image/*,application/pdf" onChange={onFileChange}/>
        </Field>
        {attachError && <div className="muted" style={{color:'var(--red)', marginBottom:8}}>{attachError}</div>}
        {pendingAttachment && pendingAttachment.type!=='application/pdf' &&
          <img src={pendingAttachment.dataUrl} alt="Pré-visualização" style={{maxWidth:160, borderRadius:8, border:'1px solid var(--line)', marginBottom:8}}/>}
        {pendingAttachment && pendingAttachment.type==='application/pdf' &&
          <div className="muted" style={{marginBottom:8}}>PDF selecionado: {pendingAttachment.name}</div>}

        <div className="modal-actions">
          <button type="button" className="btn outline" onClick={()=>{setModal(false); setPendingAttachment(null); setAttachError('');}}>Cancelar</button>
          <button type="button" className="btn" onClick={save}>Registrar</button>
        </div>
      </Modal>}
      {viewing && <AttachmentViewer attKey={viewing.attKey} name={viewing.name} onClose={()=>setViewing(null)}/>}
      {importModal && <ImportarNota db={db} setDB={setDB} onClose={()=>setImportModal(false)}/>}
    </div>
  );
}

// ---------- TRANSFERENCIAS ----------
const STOCK_LOCATIONS = ['Principal','Produção','Venda'];
const stockKeyFor = (location) => location==='Principal' ? 'stockPrincipal' : location==='Produção' ? 'stockProducao' : 'stockVenda';

function Transferencias({db, setDB}){
  const [modal, setModal] = useState(false);
  const blank = {productId:'', qty:'', origin:'Principal', destination:'Venda'};
  const [form, setForm] = useState(blank);
  const [error, setError] = useState('');

  const save = () => {
    const qty = parseFloat(form.qty)||0;
    if(!form.productId || qty<=0 || form.origin===form.destination) return;
    setError('');
    setDB(d => {
      const originKey = stockKeyFor(form.origin), destKey = stockKeyFor(form.destination);
      const originStock = {...d[originKey]}, destStock = originKey===destKey ? originStock : {...d[destKey]};
      if((originStock[form.productId]||0) < qty){ setError(`Estoque em "${form.origin}" insuficiente.`); return d; }
      originStock[form.productId] -= qty;
      destStock[form.productId] = (destStock[form.productId]||0)+qty;
      return {...d, [originKey]: originStock, [destKey]: destStock,
        transfers:[...d.transfers, {id:uid(), productId:form.productId, qty, origin: form.origin, destination: form.destination, date: nowStr()}]};
    });
    setForm(blank); setModal(false);
  };

  const removeTransfer = (t) => {
    setDB(d => {
      const originKey = stockKeyFor(t.origin), destKey = stockKeyFor(t.destination);
      const originStock = {...d[originKey]}, destStock = originKey===destKey ? originStock : {...d[destKey]};
      originStock[t.productId] = (originStock[t.productId]||0)+t.qty;
      destStock[t.productId] = (destStock[t.productId]||0)-t.qty;
      return {...d, [originKey]: originStock, [destKey]: destStock, transfers: d.transfers.filter(x=>x.id!==t.id)};
    });
  };

  return (
    <div>
      <h1 className="page-title">Transferência entre Estoques</h1>
      <div className="page-sub">Movimente produtos entre Estoque Principal, Estoque de Produção e Área de Venda.</div>
      <div className="toolbar"><div/><button type="button" className="btn" onClick={()=>{setError(''); setModal(true);}}>+ Nova transferência</button></div>
      <div className="card">
        {db.transfers.length===0 ? <div className="empty">Nenhuma transferência registrada.</div> :
        <table><thead><tr><th>Data/Hora</th><th>Produto</th><th>Origem</th><th>Destino</th><th>Qtd.</th><th></th></tr></thead>
        <tbody>{[...db.transfers].reverse().map(t=>{
          const p = db.products.find(x=>x.id===t.productId);
          return <tr key={t.id}><td>{t.date}</td><td>{p?p.name:'—'}</td><td className="tag-principal">{t.origin}</td><td className="tag-venda">{t.destination}</td><td>{t.qty}</td>
            <td><ConfirmButton onConfirm={()=>removeTransfer(t)}/></td></tr>;
        })}</tbody></table>}
      </div>
      {modal && <Modal title="Nova transferência" onClose={()=>setModal(false)}>
        <Field label="Produto"><select value={form.productId} onChange={e=>setForm({...form,productId:e.target.value})}>
          <option value="">Selecione...</option>
          {db.products.map(p=><option key={p.id} value={p.id}>{p.name} (Principal: {db.stockPrincipal[p.id]||0} / Produção: {db.stockProducao[p.id]||0} / Venda: {db.stockVenda[p.id]||0})</option>)}
        </select></Field>
        <div className="row2">
          <Field label="Origem"><select value={form.origin} onChange={e=>setForm({...form,origin:e.target.value})}>
            {STOCK_LOCATIONS.map(l=><option key={l} value={l}>{l}</option>)}
          </select></Field>
          <Field label="Destino"><select value={form.destination} onChange={e=>setForm({...form,destination:e.target.value})}>
            {STOCK_LOCATIONS.map(l=><option key={l} value={l}>{l}</option>)}
          </select></Field>
        </div>
        {form.origin===form.destination && <div className="muted" style={{color:'var(--red)', marginBottom:8}}>Origem e destino não podem ser iguais.</div>}
        <Field label="Quantidade"><input type="number" value={form.qty} onChange={e=>setForm({...form,qty:e.target.value})}/></Field>
        {error && <div className="muted" style={{color:'var(--red)', marginBottom:8}}>{error}</div>}
        <div className="modal-actions">
          <button type="button" className="btn outline" onClick={()=>setModal(false)}>Cancelar</button>
          <button type="button" className="btn" onClick={save}>Transferir</button>
        </div>
      </Modal>}
    </div>
  );
}

const unitFamily = (u) => (u==='kg'||u==='g') ? 'peso' : (u==='l'||u==='ml') ? 'volume' : 'unidade';
const unitOptionsFor = (u) => unitFamily(u)==='peso' ? ['kg','g'] : unitFamily(u)==='volume' ? ['l','ml'] : ['un'];
const convertQty = (qty, fromUnit, toUnit) => {
  if(fromUnit===toUnit) return qty;
  if(unitFamily(fromUnit)==='peso'){
    const grams = fromUnit==='kg' ? qty*1000 : qty;
    return toUnit==='kg' ? grams/1000 : grams;
  }
  if(unitFamily(fromUnit)==='volume'){
    const ml = fromUnit==='l' ? qty*1000 : qty;
    return toUnit==='l' ? ml/1000 : ml;
  }
  return qty;
};

// ---------- RECEITAS / FICHAS TÉCNICAS ----------
function Receitas({db, setDB}){
  const [modal, setModal] = useState(null); // null | 'new' | id da receita em edição
  const blank = {id:null, name:'', outputProductId:'', newProductName:'', newProductUnit:'un', yieldQty:'', yieldUnit:'un', ingredients:[{productId:'', qty:'', unit:'un'}]};
  const [form, setForm] = useState(blank);

  const openNew = () => { setForm(blank); setModal('new'); };
  const openEdit = (r) => {
    const out = db.products.find(p=>p.id===r.outputProductId);
    setForm({
      id: r.id, name: r.name, outputProductId: r.outputProductId,
      newProductName:'', newProductUnit:'un',
      yieldQty: r.yieldQty, yieldUnit: out?out.unit:'un',
      ingredients: r.ingredients.map(i=>{
        const p = db.products.find(x=>x.id===i.productId);
        return {productId:i.productId, qty:i.qty, unit: p?p.unit:'un'};
      })
    });
    setModal(r.id);
  };

  const addIngredient = () => setForm({...form, ingredients:[...form.ingredients, {productId:'', qty:'', unit:'un'}]});
  const setIngredient = (i, field, val) => {
    const ings = [...form.ingredients]; ings[i] = {...ings[i], [field]: val};
    if(field==='productId'){
      const p = db.products.find(x=>x.id===val);
      ings[i].unit = p ? p.unit : 'un';
    }
    setForm({...form, ingredients: ings});
  };
  const removeIngredient = (i) => setForm({...form, ingredients: form.ingredients.filter((_,idx)=>idx!==i)});

  const isNewOutput = form.outputProductId === '__new__';
  const existingOutput = db.products.find(p=>p.id===form.outputProductId);
  const outputBaseUnit = isNewOutput ? (form.newProductUnit||'un') : (existingOutput?existingOutput.unit:'un');
  const yieldUnitOptions = unitOptionsFor(outputBaseUnit);

  const save = () => {
    if(!form.name) return;
    if(!isNewOutput && !form.outputProductId) return;
    if(isNewOutput && !form.newProductName) return;

    const ingredientsBase = form.ingredients.filter(i=>i.productId).map(i=>{
      const p = db.products.find(x=>x.id===i.productId);
      const enteredQty = parseFloat(i.qty)||0;
      const baseQty = p ? convertQty(enteredQty, i.unit||p.unit, p.unit) : enteredQty;
      return {productId:i.productId, qty:baseQty};
    });
    const ingredientsCost = ingredientsBase.reduce((a,i)=>{
      const p = db.products.find(x=>x.id===i.productId);
      return a + (p?p.costPrice*i.qty:0);
    },0);
    const yieldQtyEntered = parseFloat(form.yieldQty)||0;
    const yieldQtyBase = convertQty(yieldQtyEntered, form.yieldUnit||outputBaseUnit, outputBaseUnit);
    const unitCost = yieldQtyBase>0 ? ingredientsCost/yieldQtyBase : 0;

    setDB(d => {
      let products = d.products;
      let outputProductId = form.outputProductId;

      if(isNewOutput){
        outputProductId = uid();
        products = [...products, {
          id: outputProductId, code:'', barcode:'', name: form.newProductName, category:'', type:'Revenda',
          unit: form.newProductUnit||'un', supplier:'', packageLabel:'', packageQty:0, packagePrice:0,
          costPrice: unitCost, salePrice: 0, minStock: 0, status:'Ativo'
        }];
      } else {
        // produto de saída de uma ficha técnica passa a ser um produto de revenda,
        // com o custo recalculado — o preço de venda continua livre para edição manual
        products = products.map(p => p.id===outputProductId ? {...p, type:'Revenda', costPrice: unitCost} : p);
      }

      const recipeObj = {id: form.id || uid(), name: form.name, outputProductId, yieldQty: yieldQtyBase, ingredients: ingredientsBase};
      const recipes = form.id ? d.recipes.map(r=>r.id===form.id?recipeObj:r) : [...d.recipes, recipeObj];

      return {...d, products, recipes};
    });
    setForm(blank); setModal(null);
  };

  const remove = (id) => {
    setDB(d => ({...d, recipes: d.recipes.filter(r=>r.id!==id)}));
  };

  const costOf = (r) => r.ingredients.reduce((a,i)=>{
    const p = db.products.find(x=>x.id===i.productId);
    return a + (p?p.costPrice*i.qty:0);
  },0);

  return (
    <div>
      <h1 className="page-title">Fichas Técnicas (Receitas)</h1>
      <div className="page-sub">Defina os ingredientes e o rendimento de cada produto fabricado. O produto gerado é cadastrado/atualizado automaticamente como Revenda, com o custo calculado — só falta você editar o preço de venda.</div>
      <div className="toolbar"><div/><button type="button" className="btn" onClick={openNew}>+ Nova ficha técnica</button></div>
      <div className="card">
        {db.recipes.length===0 ? <div className="empty">Nenhuma ficha técnica cadastrada.</div> :
        db.recipes.map(r=>{
          const out = db.products.find(p=>p.id===r.outputProductId);
          const cost = costOf(r);
          const unitCost = r.yieldQty ? cost/r.yieldQty : 0;
          return (
            <div key={r.id} style={{borderBottom:'1px solid var(--line)', padding:'10px 0'}}>
              <div style={{display:'flex', justifyContent:'space-between'}}>
                <b>{r.name}</b>
                <div style={{display:'flex', gap:8}}>
                  <button type="button" className="btn small outline" onClick={()=>openEdit(r)}>Editar</button>
                  <ConfirmButton onConfirm={()=>remove(r.id)}/>
                </div>
              </div>
              <div className="muted">Produz: {out?out.name:'—'} · Rendimento: {r.yieldQty} {out?out.unit:'un'} · Custo total: {money(cost)} · Custo unitário: {money(unitCost)}</div>
              <div className="muted" style={{marginTop:4}}>Ingredientes: {r.ingredients.map(i=>{
                const p = db.products.find(x=>x.id===i.productId);
                return p ? `${p.name} (${i.qty} ${p.unit})` : '';
              }).filter(Boolean).join(', ')}</div>
            </div>
          );
        })}
      </div>
      {modal && <Modal title={modal==='new'?'Nova ficha técnica':'Editar ficha técnica'} wide onClose={()=>setModal(null)}>
        <Field label="Nome da receita"><input value={form.name} onChange={e=>setForm({...form,name:e.target.value})}/></Field>
        <div className="row2">
          <Field label="Produto gerado"><select value={form.outputProductId} onChange={e=>setForm({...form,outputProductId:e.target.value})}>
            <option value="">Selecione...</option>
            <option value="__new__">+ Criar novo produto...</option>
            {db.products.map(p=><option key={p.id} value={p.id}>{p.name} ({p.unit})</option>)}
          </select></Field>
          <Field label={`Rendimento`}>
            <div style={{display:'flex', gap:6}}>
              <input type="number" value={form.yieldQty} onChange={e=>setForm({...form,yieldQty:e.target.value})}/>
              <select style={{flex:'0 0 70px'}} value={form.yieldUnit} onChange={e=>setForm({...form,yieldUnit:e.target.value})}>
                {yieldUnitOptions.map(o=><option key={o} value={o}>{o}</option>)}
              </select>
            </div>
          </Field>
        </div>
        {isNewOutput && <div className="row2">
          <Field label="Nome do novo produto"><input value={form.newProductName} onChange={e=>setForm({...form,newProductName:e.target.value})}/></Field>
          <Field label="Unidade de estoque do novo produto"><select value={form.newProductUnit} onChange={e=>setForm({...form,newProductUnit:e.target.value, yieldUnit:e.target.value})}>
            <option>un</option><option>kg</option><option>g</option><option>l</option><option>ml</option>
          </select></Field>
        </div>}
        <label className="field" style={{fontFamily:"'Helvetica Neue',sans-serif", fontSize:11, color:'var(--ink-soft)', textTransform:'uppercase'}}>Ingredientes (do Estoque Principal) — informe na medida que preferir (g, kg, l, ml, un)</label>
        {form.ingredients.map((ing,i)=>{
          const ingProduct = db.products.find(p=>p.id===ing.productId);
          const unit = ing.unit || (ingProduct?ingProduct.unit:'un');
          const options = ingProduct ? unitOptionsFor(ingProduct.unit) : ['un'];
          const enteredQty = parseFloat(ing.qty)||0;
          const converted = ingProduct ? convertQty(enteredQty, unit, ingProduct.unit) : 0;
          return (
          <div key={i}>
            <div className="ing-row">
              <select value={ing.productId} onChange={e=>setIngredient(i,'productId',e.target.value)}>
                <option value="">Selecione...</option>
                {db.products.map(p=><option key={p.id} value={p.id}>{p.name} ({p.unit})</option>)}
              </select>
              <input type="number" placeholder="qtd" value={ing.qty} onChange={e=>setIngredient(i,'qty',e.target.value)}/>
              <select style={{flex:'0 0 70px'}} value={unit} onChange={e=>setIngredient(i,'unit',e.target.value)} disabled={!ingProduct}>
                {options.map(o=><option key={o} value={o}>{o}</option>)}
              </select>
              <button type="button" className="btn small danger" onClick={()=>removeIngredient(i)}>×</button>
            </div>
            {ingProduct && unit!==ingProduct.unit && enteredQty>0 &&
              <div className="muted" style={{marginTop:-4, marginBottom:6}}>= {converted.toLocaleString('pt-BR',{maximumFractionDigits:4})} {ingProduct.unit} no estoque</div>}
          </div>
          );
        })}
        <button type="button" className="btn small outline" onClick={addIngredient}>+ ingrediente</button>
        <div className="modal-actions">
          <button type="button" className="btn outline" onClick={()=>setModal(null)}>Cancelar</button>
          <button type="button" className="btn" onClick={save}>Salvar ficha</button>
        </div>
      </Modal>}
    </div>
  );
}

// ---------- PRODUÇÃO ----------
const PROD_STAGES = ['Pesagem','Preparando','Feito'];

function Producao({db, setDB}){
  const [modal, setModal] = useState(false);
  const [recipeId, setRecipeId] = useState('');
  const [batches, setBatches] = useState('1');
  const [error, setError] = useState('');

  const produce = () => {
    const recipe = db.recipes.find(r=>r.id===recipeId);
    if(!recipe) return;
    const n = parseFloat(batches)||1;
    setError('');
    // check stock — os ingredientes precisam estar no Estoque de Produção
    // (transfira do Estoque Principal para o Estoque de Produção antes de produzir)
    for(const ing of recipe.ingredients){
      const have = db.stockProducao[ing.productId]||0;
      if(have < ing.qty*n){
        const p = db.products.find(x=>x.id===ing.productId);
        setError(`Estoque insuficiente de ${p?p.name:'ingrediente'} no Estoque de Produção. Transfira do Estoque Principal em "Transferências" antes de produzir.`);
        return;
      }
    }
    const cost = recipe.ingredients.reduce((a,i)=>{
      const p = db.products.find(x=>x.id===i.productId);
      return a + (p?p.costPrice*i.qty*n:0);
    },0);
    // ao criar a ordem, os ingredientes saem do Estoque de Produção (etapa de pesagem);
    // o produto só entra na Área de Venda quando a ordem for marcada como "Feito"
    setDB(d => {
      const sprod = {...d.stockProducao};
      recipe.ingredients.forEach(ing => { sprod[ing.productId] -= ing.qty*n; });
      return {...d, stockProducao: sprod,
        productionOrders: [...d.productionOrders, {id:uid(), recipeId, recipeName:recipe.name,
          outputProductId: recipe.outputProductId, qty: recipe.yieldQty*n, cost, status:'Pesagem', date: today(), time: nowStr()}]};
    });
    setModal(false); setRecipeId(''); setBatches('1');
  };

  const setStage = (order, stage) => {
    setDB(d => {
      let sv = {...d.stockVenda};
      const wasFeito = order.status==='Feito';
      const willBeFeito = stage==='Feito';
      if(willBeFeito && !wasFeito) sv[order.outputProductId] = (sv[order.outputProductId]||0)+order.qty;
      if(!willBeFeito && wasFeito) sv[order.outputProductId] = (sv[order.outputProductId]||0)-order.qty;
      return {...d, stockVenda: sv, productionOrders: d.productionOrders.map(o=>o.id===order.id?{...o, status:stage}:o)};
    });
  };

  const removeOrder = (order) => {
    setDB(d => {
      const sprod = {...d.stockProducao}, sv = {...d.stockVenda};
      const recipe = d.recipes.find(r=>r.id===order.recipeId);
      if(recipe){ recipe.ingredients.forEach(ing => { sprod[ing.productId] = (sprod[ing.productId]||0) + ing.qty*(order.qty/(recipe.yieldQty||1)); }); }
      if(order.status==='Feito') sv[order.outputProductId] = (sv[order.outputProductId]||0)-order.qty;
      return {...d, stockProducao: sprod, stockVenda: sv, productionOrders: d.productionOrders.filter(o=>o.id!==order.id)};
    });
  };

  return (
    <div>
      <h1 className="page-title">Ordens de Produção</h1>
      <div className="page-sub">Os ingredientes saem do Estoque de Produção (transfira do Estoque Principal antes, em "Transferências"). Quando marcado como "Feito", o produto pronto entra direto na Área de Venda.</div>
      <div className="toolbar"><div/><button type="button" className="btn" onClick={()=>{setError(''); setModal(true);}} disabled={db.recipes.length===0}>+ Nova produção</button></div>
      {db.recipes.length===0 && <div className="card"><div className="empty">Cadastre uma ficha técnica antes de produzir.</div></div>}
      <div className="card">
        {db.productionOrders.length===0 ? <div className="empty">Nenhuma produção registrada.</div> :
        <table><thead><tr><th>Data</th><th>Receita</th><th>Produto gerado</th><th>Qtd. gerada</th><th>Custo</th><th>Custo unit.</th><th>Etapa</th><th></th></tr></thead>
        <tbody>{[...db.productionOrders].reverse().map(o=>{
          const p = db.products.find(x=>x.id===o.outputProductId);
          return <tr key={o.id}>
            <td>{o.time}</td><td>{o.recipeName}</td><td>{p?p.name:'—'}</td><td>{o.qty}</td><td>{money(o.cost)}</td><td>{money(o.qty?o.cost/o.qty:0)}</td>
            <td><select value={o.status||'Pesagem'} onChange={e=>setStage(o, e.target.value)}>
              {PROD_STAGES.map(s=><option key={s} value={s}>{s}</option>)}
            </select></td>
            <td><ConfirmButton onConfirm={()=>removeOrder(o)}/></td>
          </tr>;
        })}</tbody></table>}
      </div>
      {modal && <Modal title="Nova ordem de produção" onClose={()=>setModal(false)}>
        <Field label="Ficha técnica"><select value={recipeId} onChange={e=>setRecipeId(e.target.value)}>
          <option value="">Selecione...</option>
          {db.recipes.map(r=>{
            const out = db.products.find(p=>p.id===r.outputProductId);
            return <option key={r.id} value={r.id}>{r.name} (rende {r.yieldQty} {out?out.unit:'un'})</option>;
          })}
        </select></Field>
        <Field label="Quantidade de receitas (lotes)"><input type="number" min="1" value={batches} onChange={e=>setBatches(e.target.value)}/></Field>
        {error && <div className="muted" style={{color:'var(--red)', marginBottom:8}}>{error}</div>}
        <div className="modal-actions">
          <button type="button" className="btn outline" onClick={()=>setModal(false)}>Cancelar</button>
          <button type="button" className="btn" onClick={produce}>Produzir</button>
        </div>
      </Modal>}
    </div>
  );
}

// ---------- AJUSTES DE ESTOQUE ----------
function Ajustes({db, setDB}){
  const [modal, setModal] = useState(false);
  const blank = {location:'Principal', productId:'', qty:'', reason:'Perda/Quebra', note:'', date: today()};
  const [form, setForm] = useState(blank);
  const [error, setError] = useState('');

  const reasons = ['Perda/Quebra','Vencimento','Uso não comercial (ex: polvilhar forma)','Erro de contagem','Outro'];

  const save = () => {
    const qty = parseFloat(form.qty)||0;
    if(!form.productId || qty<=0) return;
    setError('');
    setDB(d => {
      const key = stockKeyFor(form.location);
      const current = d[key][form.productId] || 0;
      if(current < qty){
        setError('Quantidade maior que o estoque disponível nesse local.');
        return d;
      }
      return {
        ...d,
        [key]: {...d[key], [form.productId]: current - qty},
        adjustments: [...d.adjustments, {id: uid(), location: form.location, productId: form.productId,
          qty, reason: form.reason, note: form.note, date: form.date, time: nowStr()}]
      };
    });
    setForm(blank); setModal(false);
  };

  const removeAdjustment = (a) => {
    setDB(d => {
      const key = stockKeyFor(a.location);
      return {...d, [key]: {...d[key], [a.productId]: (d[key][a.productId]||0)+a.qty},
        adjustments: d.adjustments.filter(x=>x.id!==a.id)};
    });
  };

  return (
    <div>
      <h1 className="page-title">Ajustes de Estoque</h1>
      <div className="page-sub">Dê baixa em perdas, quebras, vencimentos ou uso não comercial (ex: farinha usada para polvilhar formas).</div>
      <div className="toolbar"><div/><button type="button" className="btn" onClick={()=>{setError(''); setModal(true);}}>+ Novo ajuste</button></div>
      <div className="card">
        {db.adjustments.length===0 ? <div className="empty">Nenhum ajuste registrado.</div> :
        <table><thead><tr><th>Data</th><th>Local</th><th>Produto</th><th>Qtd. baixada</th><th>Motivo</th><th>Observação</th><th></th></tr></thead>
        <tbody>{[...db.adjustments].reverse().map(a=>{
          const p = db.products.find(x=>x.id===a.productId);
          return <tr key={a.id}>
            <td>{a.time}</td>
            <td className={a.location==='Principal'?'tag-principal':'tag-venda'}>{a.location}</td>
            <td>{p?p.name:'—'}</td>
            <td>{a.qty} {p?p.unit:''}</td>
            <td>{a.reason}</td>
            <td className="muted">{a.note}</td>
            <td><ConfirmButton onConfirm={()=>removeAdjustment(a)}/></td>
          </tr>;
        })}</tbody></table>}
      </div>
      {modal && <Modal title="Novo ajuste de estoque" onClose={()=>setModal(false)}>
        <Field label="Local do estoque"><select value={form.location} onChange={e=>setForm({...form,location:e.target.value})}>
          <option value="Principal">Estoque Principal (insumos)</option>
          <option value="Produção">Estoque de Produção (insumos reservados)</option>
          <option value="Venda">Área de Venda (na prateleira)</option>
        </select></Field>
        <Field label="Produto"><select value={form.productId} onChange={e=>setForm({...form,productId:e.target.value})}>
          <option value="">Selecione...</option>
          {db.products.map(p=>{
            const key = stockKeyFor(form.location);
            return <option key={p.id} value={p.id}>{p.name} (disp.: {db[key][p.id]||0})</option>;
          })}
        </select></Field>
        <div className="row2">
          <Field label="Quantidade a baixar"><input type="number" value={form.qty} onChange={e=>setForm({...form,qty:e.target.value})}/></Field>
          <Field label="Data"><input type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/></Field>
        </div>
        <Field label="Motivo"><select value={form.reason} onChange={e=>setForm({...form,reason:e.target.value})}>
          {reasons.map(r=><option key={r}>{r}</option>)}
        </select></Field>
        <Field label="Observação (opcional)"><input value={form.note} onChange={e=>setForm({...form,note:e.target.value})}/></Field>
        {error && <div className="muted" style={{color:'var(--red)', marginBottom:8}}>{error}</div>}
        <div className="modal-actions">
          <button type="button" className="btn outline" onClick={()=>setModal(false)}>Cancelar</button>
          <button type="button" className="btn" onClick={save}>Registrar ajuste</button>
        </div>
      </Modal>}
    </div>
  );
}

function Clientes({db, setDB}){
  const [modal, setModal] = useState(null);
  const blank = {type:'Pessoa Jurídica', name:'', document:'', phone:'', email:'', street:'', number:'', neighborhood:'', city:'', state:'', zip:''};
  const [form, setForm] = useState(blank);
  const [justCreatedCode, setJustCreatedCode] = useState(null);

  const openNew = () => { setForm(blank); setJustCreatedCode(null); setModal('new'); };
  const openEdit = (c) => { setForm({...blank, ...c}); setJustCreatedCode(null); setModal(c.id); };

  const save = () => {
    if(!form.name) return;
    const exists = db.clients.find(c=>c.id===form.id);
    if(exists){
      setDB(d => ({...d, clients: d.clients.map(c=>c.id===form.id?form:c)}));
      setModal(null);
    } else {
      const newClient = {...form, id: uid()};
      setDB(d => ({...d, clients: [...d.clients, newClient]}));
      setJustCreatedCode(newClient.id.slice(0,8).toUpperCase());
    }
  };
  const remove = (id) => setDB(d => ({...d, clients: d.clients.filter(c=>c.id!==id)}));

  return (
    <div>

            <td><button type="button" className="btn small outline" onClick={()=>openEdit(c)}>Editar</button> <ConfirmButton onConfirm={()=>remove(c.id)}/></td>
          </tr>
        ))}</tbody></table>}

      {modal && <Modal title={modal==='new'?'Novo cliente':'Editar cliente'} wide onClose={()=>setModal(null)}>
        {justCreatedCode ? (
          <div>
            <div className="muted" style={{marginBottom:8}}>Cliente cadastrado! Código dele pra usar na tela de pedido:</div>

        <div className="row2">
          <Field label="Nome / Razão social"><input value={form.name} onChange={e=>setForm({...form,name:e.target.value})}/></Field>
          <Field label="Tipo"><select value={form.type} onChange={e=>setForm({...form,type:e.target.value})}>
            <option>Pessoa Jurídica</option><option>Pessoa Física</option>
          </select></Field>
        </div>
        <div className="row2">
          <Field label={form.type==='Pessoa Física' ? 'CPF' : 'CNPJ'}><input value={form.document} onChange={e=>setForm({...form,document:e.target.value})}/></Field>
          <Field label="Telefone"><input value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})}/></Field>
        </div>
        <Field label="E-mail"><input value={form.email} onChange={e=>setForm({...form,email:e.target.value})}/></Field>
        <div className="row2">
          <Field label="Rua"><input value={form.street} onChange={e=>setForm({...form,street:e.target.value})}/></Field>
          <Field label="Número"><input value={form.number} onChange={e=>setForm({...form,number:e.target.value})}/></Field>
        </div>
